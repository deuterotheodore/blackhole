// ---- camera exclusion zone -------------------------------------------------
// Last-known-good rig state, plus scratch vectors (allocated once, not per frame).
const _prevCamPos  = new THREE.Vector3();
const _prevTarget  = new THREE.Vector3();
const _segDelta    = new THREE.Vector3();
const _segClosest  = new THREE.Vector3();
let camVetoed = false;

// Does the straight segment a→b pass within radius R of the origin?
// A point-in-sphere test on b alone is not enough: a single dolly step can be
// tens of units long and step clean over a 10-unit-diameter ball, so the camera
// tunnels through the zone while every sampled frame reads as "outside".
function segmentEntersSphere(a, b, R) {
  _segDelta.subVectors(b, a);
  const dd = _segDelta.lengthSq();
  // Parameter of closest approach to the origin, clamped to the segment.
  const t = dd > 1e-12
    ? Math.max(0, Math.min(1, -a.dot(_segDelta) / dd))
    : 0;
  _segClosest.copy(a).addScaledVector(_segDelta, t);
  return _segClosest.lengthSq() < R * R;
}


// =====================================================================
// MASS GROWTH  —  the hole grows in three.js space as it accretes
// ---------------------------------------------------------------------
// Single source of truth for the live horizon scale. Called once at the top of
// every frame, BEFORE the observer gate, the physics substeps, and the uniform
// pushes, so nothing in a frame ever sees a half-updated GM/RS.
//
//   g = M_now / M_ref = 1 + accretedMassKg / (bhMassSolar · M_sun)
//
// bhMassSolar is the REFERENCE mass that fixed the internal<->km scale
// (kmPerInternal); it is deliberately NOT the growing mass, so km-per-three.js
// stays constant and "the hole doubled in three.js units" == "the hole doubled
// in km".
//
// Scaling model: a heavier hole feeds a LARGER disk, so nearly every length
// scales with the horizon (GM, RS, b_crit, the near-hole kill/forbid radii, the
// ISCO, AND the spawn/escape/active-region radii + their bin geometry). Two
// things are deliberately anchored elsewhere:
//   • existing particles are never moved — they integrate under the growing GM,
//     so the hole genuinely gains on the orbits already present;
//   • the lone star's orbit is pinned to the fixed physical scale (auPerInternal,
//     which uses the reference mass) and its safe-periapsis clamp reads the frozen
//     R_HITBOX0, so it stays put while everything else scales.
// Over a long run the freshly-fed disk therefore grows uniformly with the hole,
// but at any instant the hole is overtaking the material currently in orbit.
//
// Positive feedback is intentional: diskMassInternal() = k·GM grows with GM, so
// each particle's dynamical AND booked mass rises as the hole grows, accelerating
// accretion. Exponential, not divergent (each frame adds a bounded increment);
// lower k_disk or simSpeed if it runs away faster than you'd like.
function applyMassGrowth() {
  const mRefKg = bhMassSolar * MSUN_KG;
  const g = mRefKg > 0 ? 1 + accretedMassKg / mRefKg : 1;
  massGrowthFactor = g;

  GM = GM0 * g;
  RS = RS0 * g;                                   // == 2·GM/c², kept in lockstep
  B_CRIT        = 3 * Math.sqrt(3) * GM / (C*C);  // photon ring grows with the hole
  R_INNER_KILL  = REL_INNER * RS;
  R_FORBID      = 2.0 * RS;
  SAFE_SPAWN_FLOOR = REL_SPAWN_FLOOR * RS;
  T_ISCO_INTERNAL  = 2 * Math.PI * Math.sqrt(Math.pow(6*RS,3)/GM); // ∝ g

  // Spin from accreted angular momentum: a* = J / M² (internal, M = GM). Keep J
  // physical — never super-extremal, never retrograde (the +y axis is fixed, so
  // a retrograde-dominated disk just spins the hole down to Schwarzschild rather
  // than flipping it). The cap tracks GM², so a near-extremal hole stays there as
  // it gains mass instead of being frozen by a stale J ceiling.
  const jMax = A_STAR_MAX * GM * GM;
  if (bhAngMomInternal > jMax) bhAngMomInternal = jMax;
  if (bhAngMomInternal < 0)    bhAngMomInternal = 0;
  bhSpin = bhAngMomInternal / (GM * GM);

  // Scene radii: a bigger hole feeds a bigger disk, so spawn/escape/active region
  // all scale with the horizon. (Existing particles stay put; only where NEW ones
  // appear moves outward.)

  R_HITBOX      = REL_HITBOX * RS;
  R_SPAWN_MIN   = REL_SPAWN_MIN * RS;
  R_SPAWN_MAX   = R_HITBOX * REL_SPAWN_MAX;
  R_ESCAPE      = R_SPAWN_MAX * REL_ESCAPE;
  H_TAPER_START = 5 * RS;
  H_CUTOFF      = 9 * RS;
  PG_H_MIN      = 0.12 * RS;

  // Camera exclusion tracks the growing horizon so you can't end up inside it.
  controls.minDistance = R_FORBID;

  // Rebuild the disk sampling profile + bin geometry when EITHER the horizon has
  // grown ~2% (ISCO ∝ GM, spawn/escape range larger) OR the spin has shifted
  // enough to move the ISCO (r_isco depends strongly on a*). Both are cheap and
  // only newly spawned/binned material cares, so a threshold beats every-frame.
  if (Math.abs(RS - profileBuiltRS) > 0.02 * profileBuiltRS ||
      Math.abs(bhSpin - profileBuiltSpin) > 0.01) {
    diskProfileDirty = true;
    rebuildScaleGeometry();
    profileBuiltRS = RS;
    profileBuiltSpin = bhSpin;
  }
}

function animate(now) {
  const realDt = Math.min(0.05, (now - last) / 1000);
  last = now;

  applyMassGrowth();   // update GM/RS/derived + minDistance before anything reads them

  // Veto any camera move whose *path* enters the forbidden sphere around the BH.
  // minDistance only constrains camera-to-target; panning slides the target off
  // the origin, after which the whole rig can dolly straight through the hole
  // while every camera-to-target distance stays legal.
  //
  // Rolling back camera AND target together (rather than just shoving the camera
  // outward) keeps OrbitControls' internal target+offset decomposition
  // consistent, so the correction has nothing to fight.
  _prevCamPos.copy(camera.position);
  _prevTarget.copy(controls.target);

  controls.update();

  const prevWasInside = _prevCamPos.lengthSq() < R_FORBID * R_FORBID;
  if (prevWasInside) {
    // Illegal starting state (shouldn't happen, but if it ever does — a bad
    // restore, a hand-edited constant — vetoing would restore the camera to an
    // inside position every frame and trap it there permanently). Eject
    // radially to the boundary instead of vetoing.
    const d = camera.position.length();
    if (d > 1e-6) camera.position.multiplyScalar(R_FORBID / d);
    else camera.position.set(R_FORBID, 0, 0);
    controls.target.set(0, 0, 0);
    camVetoed = true;
  } else {
    camVetoed = segmentEntersSphere(_prevCamPos, camera.position, R_FORBID);
    if (camVetoed) {
      camera.position.copy(_prevCamPos);
      controls.target.copy(_prevTarget);
    }
  }

  if (camVetoed) {
    // Re-run update with damping off. The non-damped branch zeroes sphericalDelta
    // and panOffset, discarding the residual momentum that would otherwise keep
    // re-proposing the same rejected move and buzz the camera against the wall.
    // With the rig restored and all deltas zero, this pass is a no-op on position.
    const wasDamping = controls.enableDamping;
    controls.enableDamping = false;
    controls.update();
    controls.enableDamping = wasDamping;
  }

  hitboxGroup.visible = false; // showHitboxEl.checked;
  forbidGroup.visible = false; // showForbidEl.checked;

  // Observer gate, evaluated AFTER the exclusion veto so it uses the camera
  // position actually rendered this frame. Feeds both the shader uniform and
  // the integrator clock, so they can never disagree.
  {
    const rC = camera.position.length() || 1;
    const x = RS / rC;
    const obsflag = true; // obsTermsEl.checked
    obsRsOverRcam = (obsflag && x >= 1.0 / 15.0) ? x : 0.0;
    obsTimeRate = obsRsOverRcam > 0.0 ? 1.0 / Math.sqrt(1.0 - obsRsOverRcam) : 1.0;
  }
  horizonGroup.visible = showHorizonEl.checked;
  if (showHorizonEl.checked) {
    const aLenW = bhSpin * GM;
    const rPlusW = GM + Math.sqrt(Math.max(0, GM*GM - aLenW*aLenW));
    const rEqW = Math.sqrt(rPlusW*rPlusW + aLenW*aLenW);
    horizonGroup.scale.set(rEqW, rPlusW, rEqW); // equatorial in x,z; polar r₊ in y
  }

  // per-particle mass, recomputed live from the CURRENT hole mass / N — used only
  // for the accretion tally below, never for dynamics. The massGrowthFactor is
  // what makes accretion self-reinforce: current disk mass = k·(M_ref·g).
  currentParticleMassKg = (bhMassSolar * massGrowthFactor * diskMassFraction() / Math.max(1, N)) * MSUN_KG;

  // coarse density map for drag + distribution aggregates (shape tensor,
  // voxel grid): rebuilt once per frame (not per substep) — coarse heuristics,
  // one-frame staleness is irrelevant. Built BEFORE the axes viz below so that
  // reads current-frame shape data.
  buildDensityMap();

  shapeAxesGroup.visible = showShapeAxesEl.checked;
  if (shapeAxesGroup.visible) {
    // orient the polar-map rings to the live disk plane (+y -> measured normal)
    _diskNormalV3.set(diskNormalLive[0], diskNormalLive[1], diskNormalLive[2]);
    diskMapGroup.quaternion.setFromUnitVectors(_upV3, _diskNormalV3);
  }
  if (showShapeAxesEl.checked) {
    for (let k = 0; k < 3; k++) {
      const ax = shapeAxes[k], ext = shapeExtents[k];
      const pa = shapeAxisLines[k].geometry.attributes.position.array;
      // double-ended line through the origin, half-length = rms extent
      pa[0] = -ax[0]*ext; pa[1] = -ax[1]*ext; pa[2] = -ax[2]*ext;
      pa[3] =  ax[0]*ext; pa[4] =  ax[1]*ext; pa[5] =  ax[2]*ext;
      shapeAxisLines[k].geometry.attributes.position.needsUpdate = true;
    }
  }

  for (let s = 0; s < SUBSTEPS; s++) {
    //heuristically, simulation becomes completely unstable for speedup >2000 (integration steps too large, all particles ejected from orbit almost immediately)
    // obsTimeRate = 1/lapse: one unit of camera proper time buys MORE coordinate
    // time when the camera sits in the well, so the disk evolves faster.
    const stepDt = DT * simSpeed * obsTimeRate;
    step(stepDt);
    internalTimeElapsed += stepDt;
  }

  updateStar(DT * simSpeed * SUBSTEPS * obsTimeRate); // star orbits on the same coordinate clock

  updateParticleBuffers();
  updateStarfield();
  renderer.render(scene, camera);

  frameCount++; fpsAccum += realDt;
  if (fpsAccum > 0.5) {
    const fps = Math.round(frameCount / fpsAccum);
    frameCount = 0; fpsAccum = 0;

    const tauUnitSec = TAU_SEC_PER_MSUN * bhMassSolar;   // per fixed internal unit — growth-invariant
    const kmPerUnit  = RS_KM_PER_MSUN * bhMassSolar;      // km per 1 three.js unit (fixed by reference mass)
    const mBhSolarNow = bhMassSolar * massGrowthFactor;   // current (accreted) hole mass
    const stepDtPhysSec = DT * simSpeed * obsTimeRate * tauUnitSec;
    const tIscoPhysSec = T_ISCO_INTERNAL * tauUnitSec;
    const stepOverIsco = stepDtPhysSec / tIscoPhysSec;
    const elapsedPhysSec = internalTimeElapsed * tauUnitSec;
    const diskMassSolar = mBhSolarNow * diskMassFraction();   // disk tracks the grown hole

    const accuracyFlag = stepOverIsco > 0.2 ? '  ⚠ integrator likely unstable near ISCO'
                        : stepOverIsco > 0.05 ? '  (visible error expected near ISCO)'
                        : '';

    const accretedFraction = accretedMassKg / (bhMassSolar * MSUN_KG);


    // ---- tiny builders for the diagnostics table ----------------------
    // sec(title)          → section header row
    // row(label, value)   → label / value row; value cell is the bright one
    // u(text)             → dim unit or qualifier inside a value cell
    const _rows = [];
    const sec = (t) => _rows.push(
      `<tr class="${_rows.length ? '' : 'first'}"><th class="sec" colspan="2">${t}</th></tr>`);
    const row = (k, v) => _rows.push(
      `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`);
    const u = (t) => `<span class="u">${t}</span>`;
    // Geometry rows are labeled "r_s" but hold raw three.js coordinates. With a
    // growing horizon, 1 unit ≠ 1 r_s, so convert to true horizon radii for display.
    const inRs = (x) => x / RS;

    sec('render');
    row('frame rate',      `${fps} ${u('fps')}`);
    row('particles',       `${N}`);
    row('b_crit',          `${inRs(B_CRIT).toFixed(2)} ${u('r_s')}`);

    sec('camera');
    row('r_cam',           `${inRs(camera.position.length()).toFixed(2)} ${u('r_s')}`);
    row('forbidden below', `${inRs(R_FORBID).toFixed(1)} ${u('r_s')}`);
    if (camVetoed) row('state', `<span class="warn">⛔ VETO</span>`);

    sec('observer');
    if (obsRsOverRcam <= 0) {
      row('terms', `<span class="u">off (flat-space camera)</span>`);
    } else {
      const lapse    = Math.sqrt(1 - obsRsOverRcam);
      const rCam     = RS / obsRsOverRcam;
      const psi      = Math.asin(Math.min(1, B_CRIT * lapse / rCam)) * 180 / Math.PI;
      const psiFlat  = Math.asin(Math.min(1, B_CRIT / rCam))         * 180 / Math.PI;
      row('terms',           `<span class="ok">on</span>`);
      row('r_s / r_cam',     obsRsOverRcam.toFixed(4));
      row('lapse',           lapse.toFixed(4));
      row('ν_obs / ν',       (1 / lapse).toFixed(4));
      row('bolometric',      `×${Math.pow(1 / lapse, 4).toFixed(2)} ${u('(T⁴ in logLvis)')}`);
      row('shadow ψ',        `${psi.toFixed(2)}°`);
      row('ψ vs flat cam',   `${psiFlat.toFixed(2)}° ${u(`(${(100 * (psi / psiFlat - 1)).toFixed(1)}%)`)}`);
      row('dt_coord / dτ_cam', obsTimeRate.toFixed(4));
      row('disk runs fast by', `${((obsTimeRate - 1) * 100).toFixed(1)}%`);
    }

    sec('geometry');
    row('hitbox',          `${inRs(R_HITBOX).toFixed(0)} ${u('r_s')}`);
    row('disk',            `${inRs(R_SPAWN_MIN).toFixed(1)}–${inRs(R_SPAWN_MAX).toFixed(0)} ${u('r_s')}`);
    row('inside hitbox',   `${lastInsideCount}`);
    row('avg dτ/dt there', lastAvgG.toFixed(3));

    sec(`physical scale &nbsp;<span class="u">M_BH = ${formatCompact(mBhSolarNow, ' M☉')}</span>`);
    if (massGrowthFactor > 1.0005)
      row('grown',           `×${massGrowthFactor.toFixed(3)} ${u(`(from ${formatCompact(bhMassSolar, ' M☉')})`)}`);
    row('r_s',             `${formatLength(kmPerUnit * RS)} ${u(`(${RS.toFixed(2)} units)`)}`);
    row('hitbox',          formatLength(kmPerUnit * R_HITBOX));
    row('disk out to',     formatLength(kmPerUnit * R_SPAWN_MAX));
    row('Δt / step',       `${formatTime(stepDtPhysSec)} ${u(`(${(stepOverIsco * 100).toFixed(2)}% T_ISCO)`)}${accuracyFlag}`);
    row('elapsed (BH proper)', formatTime(elapsedPhysSec));

    sec(`accretion &nbsp;<span class="u">blackout below ${T_CUTOFF_K.toFixed(0)} K</span>`);
    row('k_disk → M_d/M_BH', diskMassFraction().toExponential(1));
    row('disk mass',       formatCompact(diskMassSolar, ' M☉'));
    row('per particle',    formatCompact(currentParticleMassKg, ' kg'));
    row('absorbed',        `${absorbedCount} ${u(`(ΔM/M = ${accretedFraction.toExponential(2)})`)}`);
    row('escaped', `${escapeRecycleCount}`);
    row('horizon breaches', `${horizonBreachCount}`);
    row('T_peak',          formatCompact(temp0K, ' K'));
    row('T_peak / T_edd',  formatCompact(temp0K / tEdd, ''));

    sec('spin (accreted)');
    {
      const iscoRs = inRs(iscoRadius(bhSpin));   // prograde ISCO in horizon radii
      const dSpin = bhSpin - bhSpin0;
      const trend = Math.abs(dSpin) < 5e-4 ? ''
                  : dSpin > 0 ? `<span class="ok">↑ +${dSpin.toFixed(3)}</span>`
                              : `<span class="warn">↓ ${dSpin.toFixed(3)}</span>`;
      const nearExtremal = bhSpin >= A_STAR_MAX - 1e-4 ? ` ${u('(extremal cap)')}` : '';
      row('a* (live)',       `${bhSpin.toFixed(3)}${nearExtremal}`);
      row('a* set → now',    `${bhSpin0.toFixed(2)} → ${bhSpin.toFixed(3)} ${trend}`);
      row('r_isco',          `${iscoRs.toFixed(2)} ${u('r_s')}`);
    }

    row('shape extents',   `${inRs(shapeExtents[0]).toFixed(1)}:${inRs(shapeExtents[1]).toFixed(1)}:${inRs(shapeExtents[2]).toFixed(1)} ${u('r_s')}`);
    row('sphericity',      shapeSphericity.toFixed(2));
    row('minor axis',      `(${shapeAxes[2][0].toFixed(2)}, ${shapeAxes[2][1].toFixed(2)}, ${shapeAxes[2][2].toFixed(2)})`);
    row('live frame n̂',    `(${diskNormalLive[0].toFixed(2)}, ${diskNormalLive[1].toFixed(2)}, ${diskNormalLive[2].toFixed(2)})`);
    row('frame source',    shapeSphericity < DISK_FRAME_SPHERICITY_MAX
                             ? `<span class="ok">measured</span>`
                             : `<span class="u">fallback: round cloud</span>`);

    sec('polar map');
    row('grid',            `${PG_NR}×${PG_NPHI} ${u(`@ ${inRs(PG_R_MIN).toFixed(1)}–${inRs(PG_R_MAX).toFixed(0)} r_s`)}`);
    row('in-grid',         `${(100 * pgInGrid / Math.max(1, N)).toFixed(0)}%`);
    row('cells occupied',  `${pgOccupied}/${PG_NR * PG_NPHI}`);
    row('peak contrast',   `${pgPeakContrast.toFixed(1)}×`);
    row('h(r) inner',      `${inRs(pgRingH[2]).toFixed(2)} ${u('r_s')}`);
    row('h(r) mid',        `${inRs(pgRingH[(PG_NR / 2) | 0]).toFixed(2)} ${u('r_s')}`);
    row('h(r) outer',      `${inRs(pgRingH[PG_NR - 3]).toFixed(2)} ${u('r_s')}`);

    // how hard is the disk pulling on itself, compared with the hole's own
    // vertical restoring at the same height? >1 means self-gravitating.
    {
      const ri = (PG_NR / 2) | 0, ci = ri * PG_NPHI;
      const rMid = Math.sqrt(pgREdges[ri] * pgREdges[ri + 1]), h = pgRingH[ri];
      const aSelf = TWO_PI * pgSigma[ci];
      const aBH   = GM * h / (rMid * rMid * rMid);
      const mEnc  = enclosedDiskMass(rMid);
      sec('self-gravity');
      row(`M_disk(&lt;${inRs(rMid).toFixed(0)} r_s)/M_BH`, (mEnc / GM).toFixed(3));
      row('sheet / BH vertical', (aSelf / Math.max(aBH, 1e-30)).toFixed(2));
      row('settling', dragStrength > 0
            ? `${(1 / (DISK_SETTLE_ZETA * dragStrength * 2 * Math.PI)).toFixed(1)} ${u('orbits')}`
            : `<span class="u">off</span>`);
    }

    statsEl.innerHTML = `<table>${_rows.join('')}</table>`;

  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
