<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Hole Simulation (prototype)</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #05060a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #cfd6e6;
  }
  #sceneContainer { position: absolute; inset: 0; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* ---------- side panel shell ---------------------------------------- */
  #sidepanel {
    position: absolute; top: 14px; left: 14px;
    width: 262px;
    /* definite height, not max-height: a flex column can only hand a
       resolvable height down to its children if it has one itself */
    height: calc(100vh - 28px);
    display: flex; flex-direction: column; gap: 8px;
    align-items: stretch;
    z-index: 10;
    font-size: 12px;
    pointer-events: none;            /* let clicks through the empty gap */
  }
  #sidepanel > * { pointer-events: auto; }

  .sidepanel-item {
    background: rgba(10, 12, 20, 0.72);
    border: 1px solid rgba(255, 179, 71, 0.18);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    overflow: hidden;                 /* keeps the rounded corners honest */
    display: flex; flex-direction: column;
    min-height: 0;
    flex: 1 1 0;                      /* expanded: share the leftover height */
  }
  /* collapsed: shrink to the summary row */
  .sidepanel-item:has(> .sp-toggle:not(:checked)) { flex: 0 0 auto; }

  .sp-toggle {                        /* visually gone, still focusable */
    position: absolute; opacity: 0;
    width: 1px; height: 1px; margin: 0; pointer-events: none;
  }

  .sp-summary {
    cursor: pointer; user-select: none;
    padding: 8px 10px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: #ffb347;
    display: flex; align-items: center; gap: 7px;
    flex: 0 0 auto;
  }
  .sp-summary::before {
    content: "\25b8";
    font-size: 10px; line-height: 1;
    transition: transform 0.15s ease;
    color: rgba(255, 179, 71, 0.7);
  }
  .sp-toggle:checked ~ .sp-summary::before { transform: rotate(90deg); }
  .sp-summary:hover { background: rgba(255, 179, 71, 0.08); }
  .sp-toggle:focus-visible ~ .sp-summary { outline: 1px solid #ffb347; outline-offset: -2px; }

  /* the scrolling body of each item */
  .sidepanel-body {
    padding: 2px 10px 10px 10px;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    flex: 1 1 0;
  }
  .sp-toggle:not(:checked) ~ .sidepanel-body { display: none; }
  .sidepanel-body::-webkit-scrollbar { width: 8px; }
  .sidepanel-body::-webkit-scrollbar-thumb {
    background: rgba(255, 179, 71, 0.25); border-radius: 4px;
  }

  /* ---------- controls ------------------------------------------------ */
  .subpanel {
    background: rgba(10, 42, 20, 0.3);
    border: 1px solid rgba(179, 255, 71, 0.18);
    border-radius: 6px;
    padding: 8px;
    margin: 8px 0;
  }
  .row { margin-bottom: 10px; }
  .row label {
    display: flex; justify-content: space-between;
    margin-bottom: 3px; color: #8b93a8;
  }
  .row output { color: #e8ecf5; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: #ffb347; }
  .checkrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  button {
    width: 100%; padding: 7px; margin-top: 4px;
    background: rgba(255, 179, 71, 0.12);
    border: 1px solid rgba(255, 179, 71, 0.35);
    color: #ffb347; border-radius: 6px; font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: rgba(255, 179, 71, 0.22); }

  /* ---------- stats table --------------------------------------------- */
  #stats {
    font-size: 11px;
    line-height: 1.35;
    color: #6b7385;
  }
  #stats table { width: 100%; border-collapse: collapse; }
  #stats th.sec {
    text-align: left;
    padding: 7px 0 3px 0;
    color: #9bc35a;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(179, 255, 71, 0.15);
  }
  #stats tr.first th.sec { padding-top: 2px; }
  #stats td.k {
    color: #8b93a8;
    padding: 1px 6px 1px 0;
    vertical-align: top;
  }
  #stats td.v {
    color: #ffd79a;                      /* the numbers, bright */
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    vertical-align: top;
  }
  #stats .u { color: #7d8496; font-weight: 400; }   /* units / qualifiers */
  #stats .warn { color: #ff6b6b; }
  #stats .ok   { color: #9bc35a; }

  #hint {
    position: absolute; bottom: 12px; left: 14px;
    color: #44465a; font-size: 11px;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="sceneContainer"></div>

<div id="sidepanel">

  <!-- ============ item 1: controls ============ -->
  <div class="sidepanel-item" id="panelItem">
    <input type="checkbox" class="sp-toggle" id="spControls" checked>
    <label class="sp-summary" for="spControls">Controls</label>
    <div class="sidepanel-body" id="panel">

      <div class="row">
        <label><span>Sim speed (Δt ×)</span><output id="outSpeed">1.0×</output></label>
        <input type="range" id="simSpeedLog" min="-2" max="3.3" step="0.01" value="0">
      </div>

      <div class="subpanel">
        BH parameters
        <div class="row">
          <label><span>Mass</span><output id="outBhMass">1.0e+4 M☉</output></label>
          <input type="range" id="bhMassLog" min="0.3" max="10" step="0.1" value="4">
        </div>

        <div class="row">
          <label><span>Spin (Kerr)</span><output id="outBhSpin">0.00</output></label>
          <input type="range" id="bhSpinEl" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="row">
          <label><span>Disk peak temperature</span><output id="outTemp0">1e+5 K</output></label>
          <input type="range" id="temp0Log" min="-3" max="0" step="0.01" value="-1.25">
        </div>

        <div class="row">
          <div class="checkrow">
            <input type="checkbox" id="ringImagesEnabled" checked>
            <label for="ringImagesEnabled" style="color:#8b93a8;">Higher-order lensed images</label>
          </div>
          <label><span>Higher-order brightness</span><output id="outHO">0.004</output></label>
          <input type="range" id="hoEl" min="0" max="1" step="0.01" value="0.04">
        </div>

        <div class="checkrow">
          <input type="checkbox" id="dopplerEnabled" checked>
          <label for="dopplerEnabled" style="color:#8b93a8;">Doppler shift + beaming</label>
        </div>
        <div class="row">
          <label><span>Beaming exponent (4 = physical)</span><output id="outBeamC">3</output></label>
          <input type="range" id="beamCEl" min="0" max="6" step="0.1" value="3">
        </div>
        <div class="row">
          <label><span>Doppler β cutoff</span><output id="outBetaCut">0.05</output></label>
          <input type="range" id="betaCutEl" min="0" max="0.3" step="0.01" value="0.05">
        </div>

        <div class="checkrow">
          <input type="checkbox" id="showHorizon">
          <label for="showHorizon" style="color:#8b93a8;">Show horizon wireframe</label>
        </div>

      </div>

      <div class="subpanel">
        Accretion Disk mechanics
        <div class="row">
          <label><span>Particles</span><output id="outN">80000</output></label>
          <input type="range" id="nParticles" min="200" max="200000" step="200" value="80000">
        </div>

        <div class="row">
          <label><span>Disk mass</span><output id="outK">0.2</output></label>
          <input type="range" id="kDisk" min="0" max="1" step="0.01" value="0.2">
        </div>
        <div class="checkrow">
          <input type="checkbox" id="sphericalSpawnEl">
          <label for="sphericalSpawnEl" style="color:#8b93a8;">Spherical distribution</label>
        </div>
        <div class="row">
          <label><span>Velocity noise (σ)</span><output id="outVelNoise">0.01</output></label>
          <input type="range" id="velNoiseEl" min="0" max="0.3" step="0.01" value="0.01">
        </div>

        <div class="row">
          <label><span>Position noise (σ)</span><output id="outPosNoise">0.02</output></label>
          <input type="range" id="posNoiseEl" min="0" max="0.2" step="0.01" value="0.02">
        </div>

        <div class="row">
          <label><span>Drag strength (viscosity)</span><output id="outDrag">0.3</output></label>
          <input type="range" id="dragEl" min="0" max="2" step="0.01" value="0.3">
        </div>

        <div class="checkrow">
          <input type="checkbox" id="showShapeAxes">
          <label for="showShapeAxes" style="color:#8b93a8;">Show distribution axes</label>
        </div>
      </div>

      <div class="subpanel">
        Planck → rgb (display policy)
        <div class="row">
          <label><span>Black point (log₁₀ L_vis)</span><output id="outBrightLo">-6.0</output></label>
          <input type="range" id="brightLoEl" min="-12" max="2" step="0.1" value="-6">
        </div>
        <div class="row">
          <label><span>Full scale (log₁₀ L_vis)</span><output id="outBrightHi">8</output></label>
          <input type="range" id="brightHiEl" min="0" max="20" step="0.1" value="8">
        </div>
        <div class="row">
          <label><span>Contrast γ</span><output id="outGamma">0.8</output></label>
          <input type="range" id="gammaEl" min="0.2" max="3" step="0.05" value="0.8">
        </div>
        <div class="row">
          <label><span>Whiteout knee</span><output id="outWhiteout">0.75</output></label>
          <input type="range" id="whiteoutEl" min="0" max="1" step="0.01" value="0.75">
        </div>
        <div class="row">
          <label><span>Cold false-colour</span><output id="outFalseAmt">0.2</output></label>
          <input type="range" id="falseAmtEl" min="0" max="1" step="0.01" value="0.2">
        </div>
        <div class="row">
          <label><span>Dark threshold (r+g+b)</span><output id="outFalseDark">0.40</output></label>
          <input type="range" id="falseDarkEl" min="0" max="2" step="0.02" value="0.4">
        </div>
        <div class="row">
          <label><span>Cold threshold (K)</span><output id="outFalseCold">3000</output></label>
          <input type="range" id="falseColdEl" min="500" max="8000" step="100" value="3000">
        </div>
        <div class="row">
          <label><span>Size ∝ brightness</span><output id="outSizeGain">0.25</output></label>
          <input type="range" id="sizeGainEl" min="0" max="2" step="0.05" value="0.25">
        </div>
      </div>

      <div class="subpanel">
        Starfield
        <div class="checkrow">
          <input type="checkbox" id="starfieldEnabled" checked>
          <label for="starfieldEnabled" style="color:#8b93a8;">Remote starfield</label>
        </div>
        <div class="row">
          <label><span>Brightness</span><output id="outStarBright">2.5</output></label>
          <input type="range" id="starBrightEl" min="0" max="3" step="0.05" value="2.5">
        </div>
        <div class="row">
          <label><span>Star count</span><output id="outNStars">8000</output></label>
          <input type="range" id="nStarsEl" min="2000" max="20000" step="500" value="8000">
        </div>
        <div class="row">
          <label><span>Star size (px)</span><output id="outStarPixel">1.5</output></label>
          <input type="range" id="starPixelEl" min="1" max="10" step="0.5" value="1.5">
        </div>
      </div>

      <div class="subpanel">
        Lone Star
        <div class="checkrow">
          <input type="checkbox" id="starVisible" checked>
          <label for="starVisible" style="color:#8b93a8;">Show star</label>
        </div>
        <div class="row">
          <label><span>semi-major axis</span><output id="outStarA">1.00 AU</output></label>
          <input type="range" id="starA" min="0.4" max="2.5" step="0.01" value="1.0">
        </div>
        <div class="row">
          <label><span>eccentricity</span><output id="outStarE">0.30</output></label>
          <input type="range" id="starE" min="0" max="0.8" step="0.01" value="0.3">
        </div>
        <div class="row">
          <label><span>inclination</span><output id="outStarI">10°</output></label>
          <input type="range" id="starI" min="0" max="90" step="1" value="10">
        </div>
        <div class="row">
          <label><span>radius</span><output id="outStarR">1.0 R☉</output></label>
          <input type="range" id="starR" min="0.2" max="20" step="0.1" value="1.0">
        </div>
        <div class="row">
          <label><span>temperature</span><output id="outStarT">5.8 kK</output></label>
          <input type="range" id="starT" min="2.5" max="30" step="0.1" value="5.8">
        </div>
      </div>

      <button id="reset">Reset simulation</button>
    </div>
  </div>

  <!-- ============ item 2: stats ============ -->
  <div class="sidepanel-item" id="statsItem">
    <input type="checkbox" class="sp-toggle" id="spStats" checked>
    <label class="sp-summary" for="spStats">Diagnostics</label>
    <div class="sidepanel-body">
      <div id="stats"></div>
    </div>
  </div>

</div>
</div>

<div id="hint">drag: orbit · scroll: zoom · shift-drag: pan · <a href="https://flaez.ch/">flaez.ch</a>  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

"use strict";

// =====================================================================
// PHYSICS
// =====================================================================
//natural units mean M=0.5, r_s = 1, B_CRIT ~= 2.6
const C = 1;

// --- reference (unaccreted) scale --------------------------------------------
// GM0/RS0 are the mass and horizon the hole is spawned with on initialization. 
// These values set the internal<->physical scale (kmPerInternal) and they anchor every 
// length that belongs to the fixed-scale scene the hole grows into (spawn annulus, hitbox,
// escape radius, disk taper). Those scene constants are declared with `* RS0`
// (or evaluated while RS === RS0) so they freeze at initialization and the hole grows relative to them.
const GM0 = 0.5;
const RS0 = 2 * GM0 / (C*C);   // == 1 three.js unit, by construction

// relative dimensions now defined as separate constants, to be re-applied in applyMassGrowth
const REL_INNER = 2.5;
const REL_HITBOX = 15;
const REL_SPAWN_FLOOR = 1.5;
const REL_SPAWN_MIN = 2.5;
const REL_SPAWN_MAX = 4.5; // units of REL_HITBOX 
const REL_ESCAPE = 1.5; // units of REL_SPAWN_MAX

// --- live scale (grows with accretion) ---------------------------------------
// GM/RS are mutated by applyMassGrowth() once per frame. Anything physically
// tied to the horizon (near-hole kill/forbid radii, the photon-ring b_crit, the
// lensing shaders via uRs/uBcrit, the ISCO) must read these live values or be
// recomputed from them in applyMassGrowth(), never bake in RS === 1.
let GM = GM0;
let RS = RS0;
let B_CRIT = 3 * Math.sqrt(3) * GM / (C*C);
let R_INNER_KILL = REL_INNER * RS;
let R_HITBOX = REL_HITBOX * RS;             // active-integration region — grows with the hole (bigger hole, bigger disk)
const R_HITBOX0 = REL_HITBOX * RS0;         // frozen birth hitbox: needed just for the lone star's orbit clamp, so the star stays put

// Camera exclusion zone. Intended as the radius inside which
// the rendering approximations (thin-lens zeroth order, Born-approximation Kerr
// correction, higher-order-image handling) stop being defensible. 
// This is pragmatic to some extent, we are happy to push it a little beyond
// what is technically "defensible". A reasonable comporomise would be 5*RS, 
// using 2*RS is probably unreasonably close, but we'll use it just so the 
// effects can become clearly visible.
let R_FORBID = 2 * RS;   // grows with the horizon; controls.minDistance tracks it

// Spawn annulus. These SCALE with the horizon: a heavier hole feeds a larger
// disk, so fresh material spawns (and recycles) farther out as RS grows. Note
// this only moves where new particles appear — existing particles keep their
// orbits, so the hole genuinely gains on the material already present.
let SAFE_SPAWN_FLOOR = REL_SPAWN_FLOOR * RS;
let R_SPAWN_MIN = REL_SPAWN_MIN * RS;          // inner spawn floor; the ISCO (also ∝ GM) takes over via buildDiskProfile
let R_SPAWN_MAX = R_HITBOX * REL_SPAWN_MAX;
let R_ESCAPE = R_SPAWN_MAX * REL_ESCAPE;

// physical-unit conversion layer: purely a display/labeling layer on top of
// the dimensionless (RS=1, GM=0.5, c=1) integrator above. Changing bhMassSolar
// never touches the dynamics — only how internal units are reported in km/s.
const RS_KM_PER_MSUN = 2.9532500;    // Schwarzschild radius per solar mass
const TAU_SEC_PER_MSUN = 9.8508e-6;  // seconds per internal time-unit, per solar mass
// kDisk is no longer an arbitrary spring constant: it IS the disk's total mass,
// expressed as a fraction of M_BH and mapped logarithmically so the slider spans
// "dynamically irrelevant" to "self-gravitating". At the top of the range the
// disk's vertical pull on its own material is comparable to the hole's, which is
// the regime where a real disk would fragment.
const DISK_MASS_MIN = 1e-3;          // kDisk just above 0
const DISK_MASS_MAX = 1.0;           // kDisk = 1  ->  M_disk = M_BH
function diskMassFraction() {
  return kDisk <= 0 ? 0 : DISK_MASS_MIN * Math.pow(DISK_MASS_MAX / DISK_MASS_MIN, kDisk);
}
// internal units have G = 1, so M_BH = GM and the disk mass is a plain number
function diskMassInternal() { return diskMassFraction() * GM; }
const MSUN_KG = 1.989e30;
let bhMassSolar = 1e4;               // "intermediate" default, r_s ~= 30000 km, scene is a few light-seconds across (100*r_s ~= 0.02 AU)
let bhSpin = 0;                      // dimensionless Kerr spin a* = Jc/(GM²) ∈ [0,1]; 0 = Schwarzschild
// Spin is now dynamic: the slider sets the initial value bhSpin0, and
// accretion evolves it. bhAngMomInternal is the hole's total angular momentum J
// about the +y spin axis in internal units (G=c=1, M_BH=GM), so a* = J/GM².
// Absorbed particles add their L_y (see step()); a* is recomputed each frame in
// applyMassGrowth(). Prograde disk ⇒ L_y > 0 ⇒ spin-up, exactly as a real
// disk-fed hole spins toward the Thorne limit.
let bhSpin0 = 0;                     // slider-set spin (the value reset restores)
let bhAngMomInternal = 0;           // J about +y, internal units; a* = J/(GM·GM)
const A_STAR_MAX = 0.998;           // Thorne limit — accretion cannot spin past this
let sphericalSpawn = false;          // isotropic (spherical) initial distribution vs. flat disk
let internalTimeElapsed = 0;         // accumulated internal time-units since page load

// --- terminal redshift / accretion bookkeeping ---
// A particle is treated as "absorbed" once its observed (redshifted)
// temperature drops below T_CUTOFF_K — the temperature at which its color
// is already indistinguishable from black (see the FOPT/brightness
// machinery above). 
let currentParticleMassKg = 0; // recomputed each frame from bhMassSolar/N — display + accretion bookkeeping only, never dynamical
let accretedMassKg = 0;
let massGrowthFactor = 1;      // M_now / M_ref; drives the live GM/RS in applyMassGrowth()
let absorbedCount = 0;
let escapeRecycleCount = 0;
let horizonBreachCount = 0; // dedicated counter for the explicit r<=RS safety check

let T_ISCO_INTERNAL = 2 * Math.PI * Math.sqrt(Math.pow(6*RS,3)/GM); // ISCO period (∝ M; recomputed in applyMassGrowth)

let N = 80000;
let kDisk = 0.2; // normalized [0,1] (disk mass)
const TWO_PI = 2 * Math.PI;
// Vertical settling is dissipation, so it belongs to viscosity, not to mass.
// A real disk does not flatten because it is self-gravitating (it usually isn't);
// it flattens because collisions radiate away vertical kinetic energy while
// angular momentum is conserved. The restoring force is already supplied by the
// hole, so all that is needed is damping at a rate set by the orbital frequency.
const DISK_SETTLE_ZETA = 0.35;   // x dragStrength = damping ratio; 0.1 -> ~4.6 orbits
let simSpeed = 1.0;
let velNoise = 0.01;
let posNoise = 0.02;
const DT = 0.01;
const SUBSTEPS = 2;

// disk temperature (Shakura-Sunyaev temperature field): T(r) ~ T0 * r^(-3/4). 
// T0  realistically should be (near) Eddington temperature
// "cheat" slider temp0Log allows lowering this so the disk isn't in complete whiteout
let tEdd = eddingtonPeakTempK(bhMassSolar);
let temp0K = 0.056*tEdd; // log slider temp0Log

// blackbody color table. LOGT is natural-log(T in kK), exp(4.605) = 100.0 kK
const LOGT = [0.0, 0.833, 1.361, 1.668, 1.792, 1.988, 2.303, 3.497, 4.605];
const PLANCK_RGB = [
  [0.251, 0.000, 0.000], [1.000, 0.404, 0.129],
  [1.000, 0.784, 0.529], [0.973, 1.000, 0.914],
  [0.894, 0.996, 1.000], [0.706, 0.878, 1.000],
  [0.529, 0.753, 1.000], [0.337, 0.592, 1.000],
  [0.298, 0.545, 0.973]
];
// FOPT: fraction of blackbody power falling in the visible band. 
//This table has ONE MORE entry than LOGT/PLANCK_RGB (10 vs 9),
// this is a bit awkward, but FOPT[1..9] pairs with LOGT[0..8] 
// FOPT[0] is used by buildTempLUT, so truncate it as FOPT_MATCHED,
// it's fine, just leave it like this.
const FOPT = [1e-8, 6e-6, 0.03, 0.24, 0.39, 0.42, 0.43, 0.35, 0.035, 0.0017];
const FOPT_MATCHED = FOPT.slice(1); // length 9, aligned with LOGT

function log10(x) { return Math.log(x) / Math.LN10; }

// log10(FOPT) as a function of temperature: log-log interpolated within the
// table, log-log extrapolated below LOGT[0]=1kK using the slope of the
// lowest known segment (there's no data down there, but the falloff has to
// continue smoothly, and this is the simplest defensible continuation).
function foptLog10FromTemp(tKelvin) {
  const logT = Math.log(tKelvin / 1000);
  if (logT <= LOGT[0]) {
    const slope = (log10(FOPT_MATCHED[1]) - log10(FOPT_MATCHED[0])) / (LOGT[1] - LOGT[0]);
    return log10(FOPT_MATCHED[0]) + slope * (logT - LOGT[0]);
  }
  if (logT >= LOGT[LOGT.length - 1]) return log10(FOPT_MATCHED[FOPT_MATCHED.length - 1]);
  let idx = 0;
  while (idx < LOGT.length - 2 && LOGT[idx + 1] < logT) idx++;
  const t0 = LOGT[idx], t1 = LOGT[idx + 1];
  const frac = (logT - t0) / (t1 - t0);
  const f0 = log10(FOPT_MATCHED[idx]), f1 = log10(FOPT_MATCHED[idx + 1]);
  return f0 + (f1 - f0) * frac;
}
// =====================================================================
// foptLog10FromTemp() clamps flat above
// LOGT[8] = 100 kK, returning log10(0.0017) forever. Harmless today
// (T_CUTOFF_K is a cold-end solve) but it will disagree with the shader as
// soon as anything hot queries it. Use this instead (same tail):
// =====================================================================
function foptLog10FromTempFixed(tKelvin) {
  const logT = Math.log(tKelvin / 1000);
  const last = LOGT.length - 1;
  if (logT >= LOGT[last]) {
    return log10(FOPT_MATCHED[last]) - (2.89 / Math.LN10) * (logT - LOGT[last]);
  }
  return foptLog10FromTemp(tKelvin); // unchanged below the top of the table
}


// brightness scale: peak FOPT (0.43, log10=-0.36) -> brightness 1.0
function brightnessFromTemp(tKelvin) {
  return Math.min(1, Math.max(0, (foptLog10FromTemp(tKelvin) + 10.36) / 10));
}

// cutoff temperature: solved numerically (bisection, not hand-derived) for
// where hue*brightness drops below "#020000" — using PLANCK_RGB[0]'s red
// channel (0.251) since that's the only nonzero channel in the cold/clamped
// hue regime where this cutoff actually matters.
const BRIGHTNESS_CUTOFF = (2/255) / PLANCK_RGB[0][0];
function findCutoffTempK(targetBrightness) {
  let lo = 1, hi = 2000;
  for (let iter = 0; iter < 80; iter++) {
    const mid = Math.sqrt(lo * hi);
    if (brightnessFromTemp(mid) < targetBrightness) lo = mid; else hi = mid;
  }
  return Math.sqrt(lo * hi);
}
const T_CUTOFF_K = findCutoffTempK(BRIGHTNESS_CUTOFF); // ~337K

const FALSE_COLOR_BROWN = [0.50, 0.32, 0.15]; // visibility hack for T < 1000K "cold dust"
const T_BROWN_FULL = 300; // below this observed temp, pure brown; blends to the table above

// ---- GPU temperature LUT (inherited from adastra's shaderstrings.js) ----
// Precompute a 256×1 RGBA float texture: rgb = blackbody color, a = FOPT
// (visible-band power fraction). The shader's tempLookup(tempKK) samples this
// and handles blackout (<1kK) and whiteout (>33kK) analytically. Reuses the
// existing LOGT/PLANCK_RGB/FOPT arrays.
const LUT_LOG_T_MAX = Math.log(33); // 3.497 — upper bound of the LUT (33 kK)
function buildTempLUT() {
  const LUT_SIZE = 256;
  const data = new Float32Array(LUT_SIZE * 4);
  for (let i = 0; i < LUT_SIZE; i++) {
    const logT = (i / (LUT_SIZE - 1)) * LUT_LOG_T_MAX;
    let seg = LOGT.length - 2;
    for (let j = 0; j < LOGT.length - 1; j++) {
      if (logT <= LOGT[j + 1]) { seg = j; break; }
    }
    const t = Math.min(1, Math.max(0, (logT - LOGT[seg]) / (LOGT[seg+1] - LOGT[seg])));
    const lerp = (a, b) => a + (b - a) * t;
    data[i*4+0] = lerp(PLANCK_RGB[seg][0], PLANCK_RGB[seg+1][0]);
    data[i*4+1] = lerp(PLANCK_RGB[seg][1], PLANCK_RGB[seg+1][1]);
    data[i*4+2] = lerp(PLANCK_RGB[seg][2], PLANCK_RGB[seg+1][2]);
    data[i*4+3] = lerp(FOPT_MATCHED[seg], FOPT_MATCHED[seg+1]);
  }
  const tex = new THREE.DataTexture(data, LUT_SIZE, 1, THREE.RGBAFormat, THREE.FloatType);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
const tempLUT = buildTempLUT();

// --- drag / viscosity heuristic: a coarse RADIAL density histogram built in
// one O(N) pass (not O(N^2) pairwise interaction), volume-normalized so it's
// a genuine density estimate rather than a raw bin count. Drag is a simple
// velocity-proportional term scaled by local density — a cheap stand-in for
// MRI/viscous angular-momentum transport, tuned for watchability rather than
// derived, since real viscous inspiral timescales are far too slow to see.
let dragStrength = 0.3;
// dragStrength is normalized [0,1], scale it by DRAG_SCALE,
// this has to be a small number as the density norm's natural ~1/r^3 falloff 
// toward the center otherwise quickly makes the drag effect comically large
const DRAG_SCALE = 2e-6; 

const N_DRAG_BINS = 48;
let DRAG_R_MIN = 1.2 * RS;            // grows with the hole (near-horizon inner cutoff)
let DRAG_R_MAX = R_ESCAPE;           // = recycle radius, grows
const dragBinEdges = new Float32Array(N_DRAG_BINS + 1);
const dragBinVolumes = new Float32Array(N_DRAG_BINS);
// Birth fill (RS === 1). rebuildScaleGeometry() below re-runs these same two
// loops whenever the hole has grown — keep them in sync.
for (let i = 0; i <= N_DRAG_BINS; i++) {
  dragBinEdges[i] = DRAG_R_MIN * Math.pow(DRAG_R_MAX / DRAG_R_MIN, i / N_DRAG_BINS);
}
for (let i = 0; i < N_DRAG_BINS; i++) {
  const a = dragBinEdges[i], b = dragBinEdges[i + 1];
  dragBinVolumes[i] = (4 / 3) * Math.PI * (b*b*b - a*a*a);
}
let REFERENCE_VOLUME = (4 / 3) * Math.PI * Math.pow(DRAG_R_MAX, 3);  // grows as R_MAX³ so the drag norm stays calibrated
const dragBinCounts = new Float32Array(N_DRAG_BINS);
const dragBinDensityNorm = new Float32Array(N_DRAG_BINS).fill(1);
// Enclosed disk mass inside each bin's outer edge. The disk's own monopole was
// the missing half of "disk mass": the vertical sheet term made the disk hold
// itself flat, but nothing made its mass pull radially, so at k_disk = 1 -- where
// the disk weighs as much as the hole -- orbits were still perfectly Keplerian
// and off-plane material felt no extra central attraction to bob against.
const dragBinMassCum = new Float32Array(N_DRAG_BINS + 1);

// Enclosed disk mass at radius r, linear in log-r between bin edges so the
// resulting acceleration is continuous rather than stepping at bin boundaries.
function enclosedDiskMass(r) {
  if (r <= DRAG_R_MIN) return 0;
  if (r >= DRAG_R_MAX) return dragBinMassCum[N_DRAG_BINS];
  const t = Math.log(r / DRAG_R_MIN) / Math.log(DRAG_R_MAX / DRAG_R_MIN) * N_DRAG_BINS;
  const i = Math.min(N_DRAG_BINS - 1, Math.max(0, Math.floor(t)));
  const f = t - i;
  return dragBinMassCum[i] + f * (dragBinMassCum[i + 1] - dragBinMassCum[i]);
}

function densityBinIndex(r) {
  const rc = Math.min(DRAG_R_MAX, Math.max(DRAG_R_MIN, r));
  const t = Math.log(rc / DRAG_R_MIN) / Math.log(DRAG_R_MAX / DRAG_R_MIN);
  return Math.min(N_DRAG_BINS - 1, Math.max(0, Math.floor(t * N_DRAG_BINS)));
}

// =====================================================================
// DISTRIBUTION AGGREGATES 
// we originally implemented this to build higher-order rings as 
// drawn objects estimated from matter distribution. The rings are now emergent
// from point particles, but we'll keep this data to model accretion disk dynamics.
// Two complementary structures, both built in the same O(N) pass as the
// drag map so there's no extra loop over particles:
//   1. Shape tensor S_ij = Σ x_i x_j — a second moment, so dominated by the
//      OUTER envelope. Its eigen-decomposition gives global flatness (disk vs
//      sphere vs filament) and the live principal-axis orientation, measured
//      from actual particle data rather than assumed from the disk-bias axis.
//   2. A coarse 5^3 Cartesian voxel grid at 2 r_s cells (±5 r_s extent),
//      capturing inner-region fine spatial structure where lensing is
//      strongest. Odd n puts the disk midplane cleanly in the central layer.
// These deliberately cover different scales: the tensor sees the big outer
// shape the small grid can't reach; the grid sees inner detail the tensor
// smears into a single moment.
// =====================================================================

// A Cartesian voxel grid is the wrong shape for a disk. The old 5^3 @ 2 r_s box
// spanned +/-5 r_s, i.e. it spent most of its cells on the region the BH itself
// occupies (nothing orbits below R_SPAWN_MIN = 2.5 r_s) and reached only a
// twentieth of the way out to R_SPAWN_MAX. It also resolved z far more finely
// than the disk is thick while resolving R not at all.
//
// Replaced with a POLAR (R, phi) map in the MEASURED disk frame:
//   - log-spaced in R, starting just inside the inner disk edge, so every decade
//     of radius gets equal resolution and no cells are wasted on the hole;
//   - 16 azimuthal sectors, which is what makes the density "local" -- clumps and
//     arms show up as azimuthal contrast, the thing drag should actually respond to;
//   - z is not binned but reduced to a per-ring scale height from <z^2>, because
//     the vertical structure only enters through two numbers: the column density
//     Sigma (which sets the self-gravity) and h (which sets its softening).
// Same single O(N) pass, fewer cells, far more particles per cell.
const PG_NR = 24, PG_NPHI = 16;
let PG_R_MIN = R_SPAWN_MIN * 0.6;    // grows with the spawn floor
let PG_R_MAX = R_ESCAPE;             // grows with the recycle radius
const PG_LOGSPAN = Math.log(PG_R_MAX / PG_R_MIN);  // scale-INVARIANT: both bounds ∝ RS, so the ratio is fixed
const pgREdges  = new Float32Array(PG_NR + 1);
const pgCellArea = new Float32Array(PG_NR);   // area of a single (R,phi) cell in ring i
const pgRingArea = new Float32Array(PG_NR);   // full annulus area
// Birth fill (RS === 1); rebuildScaleGeometry() re-runs these on growth.
for (let i = 0; i <= PG_NR; i++) pgREdges[i] = PG_R_MIN * Math.exp(PG_LOGSPAN * i / PG_NR);
for (let i = 0; i < PG_NR; i++) {
  const a = pgREdges[i], b = pgREdges[i+1];
  pgRingArea[i] = Math.PI * (b*b - a*a);
  pgCellArea[i] = pgRingArea[i] / PG_NPHI;
}
const pgCount     = new Float32Array(PG_NR * PG_NPHI);
const pgSigma     = new Float32Array(PG_NR * PG_NPHI);  // surface density, internal units
const pgContrast  = new Float32Array(PG_NR * PG_NPHI).fill(1); // cell density / ring mean
const pgRingCount = new Float32Array(PG_NR);
const pgRingZ2    = new Float32Array(PG_NR);
const pgRingH     = new Float32Array(PG_NR).fill(1);    // rms |z| per ring, floored
let pgInGrid = 0, pgOccupied = 0, pgPeakContrast = 1;

// Vertical self-gravity softening: the razor-thin-sheet field 2*pi*G*Sigma is
// discontinuous at z=0, so it is softened over the measured scale height. Without
// a floor the disk collapses onto the plane, h -> 0, and the near-plane spring
// constant 2*pi*G*Sigma/h runs away -- there is no pressure support in this sim
// to stop it.
let PG_H_MIN = 0.12 * RS;

// Refill every scale-dependent bin geometry from the current horizon. The bounds
// themselves (DRAG_R_*, PG_R_*) are set from the live spawn/escape radii, then the
// edge/area/volume tables are rebuilt. Called from applyMassGrowth() once the hole
// has grown ~2%. The per-frame density/drag accumulation (counts, Sigma) is unaffected.
function rebuildScaleGeometry() {
  DRAG_R_MIN = 1.2 * RS;
  DRAG_R_MAX = R_ESCAPE;
  PG_R_MIN   = R_SPAWN_MIN * 0.6;
  PG_R_MAX   = R_ESCAPE;
  // PG_LOGSPAN and DRAG_R_MAX/DRAG_R_MIN are scale-invariant, so they need no update.
  for (let i = 0; i <= N_DRAG_BINS; i++)
    dragBinEdges[i] = DRAG_R_MIN * Math.pow(DRAG_R_MAX / DRAG_R_MIN, i / N_DRAG_BINS);
  for (let i = 0; i < N_DRAG_BINS; i++) {
    const a = dragBinEdges[i], b = dragBinEdges[i + 1];
    dragBinVolumes[i] = (4 / 3) * Math.PI * (b*b*b - a*a*a);
  }
  REFERENCE_VOLUME = (4 / 3) * Math.PI * Math.pow(DRAG_R_MAX, 3);
  for (let i = 0; i <= PG_NR; i++) pgREdges[i] = PG_R_MIN * Math.exp(PG_LOGSPAN * i / PG_NR);
  for (let i = 0; i < PG_NR; i++) {
    const a = pgREdges[i], b = pgREdges[i+1];
    pgRingArea[i] = Math.PI * (b*b - a*a);
    pgCellArea[i] = pgRingArea[i] / PG_NPHI;
  }
}

function pgRingIndexOf(R) {
  if (R < PG_R_MIN || R > PG_R_MAX) return -1;
  const t = Math.log(R / PG_R_MIN) / PG_LOGSPAN;
  return Math.min(PG_NR - 1, Math.max(0, Math.floor(t * PG_NR)));
}

// shape-tensor eigen results, refreshed each frame
let shapeExtents = [1, 1, 1];       // rms extents along principal axes, descending
let shapeAxes = [[1,0,0],[0,1,0],[0,0,1]]; // matching eigenvectors (unit), descending
let shapeSphericity = 1;            // smallest/largest extent ratio: 1=sphere, →0=flat/thin

function jacobiEigen3(m00, m01, m02, m11, m12, m22) {
  const a = [[m00,m01,m02],[m01,m11,m12],[m02,m12,m22]];
  const v = [[1,0,0],[0,1,0],[0,0,1]];
  for (let sweep = 0; sweep < 20; sweep++) {
    const off = Math.abs(a[0][1]) + Math.abs(a[0][2]) + Math.abs(a[1][2]);
    if (off < 1e-14) break;
    const pairs = [[0,1],[0,2],[1,2]];
    for (const [p, q] of pairs) {
      const apq = a[p][q];
      if (Math.abs(apq) < 1e-18) continue;
      const theta = 0.5 * Math.atan2(2*apq, a[q][q] - a[p][p]);
      const c = Math.cos(theta), s = Math.sin(theta);
      for (let k=0;k<3;k++){ const akp=a[k][p], akq=a[k][q]; a[k][p]=c*akp-s*akq; a[k][q]=s*akp+c*akq; }
      for (let k=0;k<3;k++){ const apk=a[p][k], aqk=a[q][k]; a[p][k]=c*apk-s*aqk; a[q][k]=s*apk+c*aqk; }
      for (let k=0;k<3;k++){ const vkp=v[k][p], vkq=v[k][q]; v[k][p]=c*vkp-s*vkq; v[k][q]=s*vkp+c*vkq; }
    }
  }
  return {
    values: [a[0][0], a[1][1], a[2][2]],
    vectors: [[v[0][0],v[1][0],v[2][0]],[v[0][1],v[1][1],v[2][1]],[v[0][2],v[1][2],v[2][2]]]
  };
}

function buildDensityMap() {
  dragBinCounts.fill(0);
  pgCount.fill(0); pgRingCount.fill(0); pgRingZ2.fill(0);
  pgInGrid = 0;

  // shape-tensor accumulators (second moment about the BH at origin)
  let sxx=0, sxy=0, sxz=0, syy=0, syz=0, szz=0;

  // Bin in the previous frame's disk frame. One frame stale is harmless (the
  // frame turns far slower than the disk orbits) and it breaks the circular
  // dependency: the frame is derived from the tensor accumulated in this loop.
  const n = diskNormalLive, e1 = diskE1, e2 = diskE2;

  for (let i = 0; i < N; i++) {
    const ix = i*3;
    const x = pos[ix], y = pos[ix+1], z = pos[ix+2];
    const r = Math.hypot(x, y, z);
    dragBinCounts[densityBinIndex(r)]++;

    sxx += x*x; sxy += x*y; sxz += x*z;
    syy += y*y; syz += y*z; szz += z*z;

    // project into the disk frame
    const h  = x*n[0]  + y*n[1]  + z*n[2];
    const u1 = x*e1[0] + y*e1[1] + z*e1[2];
    const u2 = x*e2[0] + y*e2[1] + z*e2[2];
    const R  = Math.hypot(u1, u2);
    pgZ[i] = h;
    const ri = pgRingIndexOf(R);
    if (ri >= 0) {
      let pi = Math.floor((Math.atan2(u2, u1) + Math.PI) * (PG_NPHI / (2*Math.PI)));
      if (pi < 0) pi = 0; else if (pi >= PG_NPHI) pi = PG_NPHI - 1;
      const ci = ri*PG_NPHI + pi;
      pgCount[ci]++; pgRingCount[ri]++; pgRingZ2[ri] += h*h;
      pgCell[i] = ci; pgRing[i] = ri; pgInGrid++;
    } else {
      pgCell[i] = -1; pgRing[i] = -1;
    }
  }

  // surface density, scale height, and azimuthal contrast
  const mPart = diskMassInternal() / Math.max(1, N);
  pgOccupied = 0; pgPeakContrast = 1;
  for (let ri = 0; ri < PG_NR; ri++) {
    const rc = pgRingCount[ri];
    pgRingH[ri] = Math.max(PG_H_MIN, rc > 0 ? Math.sqrt(pgRingZ2[ri] / rc) : PG_H_MIN);
    const meanCell = rc / PG_NPHI;     // expected count per cell if axisymmetric
    for (let pi = 0; pi < PG_NPHI; pi++) {
      const ci = ri*PG_NPHI + pi, c = pgCount[ci];
      if (c > 0) pgOccupied++;
      pgSigma[ci] = c * mPart / pgCellArea[ri];
      const k = meanCell > 0 ? c / meanCell : 1;
      pgContrast[ci] = k;
      if (k > pgPeakContrast) pgPeakContrast = k;
    }
  }

  // normalized so that a bin matching "N particles spread uniformly over the
  // whole DRAG_R_MAX sphere" reads as exactly 1.0 — makes the drag slider's
  // meaning roughly independent of N.
  const norm = REFERENCE_VOLUME / Math.max(1, N);
  for (let i = 0; i < N_DRAG_BINS; i++) {
    dragBinDensityNorm[i] = (dragBinCounts[i] / dragBinVolumes[i]) * norm;
  }

  // cumulative disk mass inside each bin edge (spherical enclosure is fine here:
  // the disk is flat, so "inside radius r" and "inside the sphere of radius r"
  // contain the same material)
  {
    const mP = diskMassInternal() / Math.max(1, N);
    let acc = 0;
    dragBinMassCum[0] = 0;
    for (let i = 0; i < N_DRAG_BINS; i++) {
      acc += dragBinCounts[i] * mP;
      dragBinMassCum[i + 1] = acc;
    }
  }

  // eigen-decompose the shape tensor (normalized by N so extents are in r_s)
  const invN = 1 / Math.max(1, N);
  const eig = jacobiEigen3(sxx*invN, sxy*invN, sxz*invN, syy*invN, syz*invN, szz*invN);
  const order = [0,1,2].sort((a,b) => eig.values[b] - eig.values[a]); // descending
  shapeExtents = order.map(k => Math.sqrt(Math.max(0, eig.values[k])));
  shapeAxes = order.map(k => eig.vectors[k]);
  shapeSphericity = shapeExtents[0] > 1e-9 ? shapeExtents[2] / shapeExtents[0] : 1;

  // ---- update the live disk frame from the tensor just measured -------------
  // Only while the cloud is actually flattened; for a round distribution the
  // minor axis is noise and the fixed spawn normal is the honest fallback.
  if (shapeSphericity < DISK_FRAME_SPHERICITY_MAX) {
    let m = shapeAxes[2];
    // sign-align to the current normal so the basis never flips
    const dotPrev = m[0]*diskNormalLive[0] + m[1]*diskNormalLive[1] + m[2]*diskNormalLive[2];
    if (dotPrev < 0) m = [-m[0], -m[1], -m[2]];
    const a = DISK_FRAME_LERP;
    let nx = diskNormalLive[0] + a*(m[0]-diskNormalLive[0]);
    let ny = diskNormalLive[1] + a*(m[1]-diskNormalLive[1]);
    let nz = diskNormalLive[2] + a*(m[2]-diskNormalLive[2]);
    const ln = Math.hypot(nx, ny, nz) || 1;
    diskNormalLive = [nx/ln, ny/ln, nz/ln];
  } else {
    const a = DISK_FRAME_LERP;
    let nx = diskNormalLive[0] + a*(diskNormal[0]-diskNormalLive[0]);
    let ny = diskNormalLive[1] + a*(diskNormal[1]-diskNormalLive[1]);
    let nz = diskNormalLive[2] + a*(diskNormal[2]-diskNormalLive[2]);
    const ln = Math.hypot(nx, ny, nz) || 1;
    diskNormalLive = [nx/ln, ny/ln, nz/ln];
  }
  rebuildDiskBasis();
}

const diskNormal = [0, 1, 0];        // spawn/reference plane; also the fallback
let H_TAPER_START = 5 * RS;   // (currently unused) grows with the disk if wired back in
let H_CUTOFF = 9 * RS;

// measure live disk frame:
// The shape tensor's minor principal axis is the disk normal. Three cautions:
//   - eigenvectors have arbitrary sign, so it is flipped to track the previous
//     frame rather than flickering between +n and -n;
//   - it is smoothed in time, because the disk bias feeds back into the very
//     distribution the tensor measures and an unfiltered loop can hunt;
//   - it is only trusted while the distribution is actually flat. For a round
//     cloud (spherical spawn) the minor axis is arbitrary noise, so the frame
//     falls back to the fixed spawn normal.
let diskNormalLive = [0, 1, 0];
let diskE1 = [1, 0, 0], diskE2 = [0, 0, 1];
const DISK_FRAME_LERP = 0.05;        // per-frame blend toward the measured axis
const DISK_FRAME_SPHERICITY_MAX = 0.75;

function rebuildDiskBasis() {
  const n = diskNormalLive;
  const ref = Math.abs(n[1]) < 0.9 ? [0,1,0] : [1,0,0];
  let e1 = [ref[1]*n[2]-ref[2]*n[1], ref[2]*n[0]-ref[0]*n[2], ref[0]*n[1]-ref[1]*n[0]];
  const l1 = Math.hypot(e1[0],e1[1],e1[2]) || 1;
  e1 = [e1[0]/l1, e1[1]/l1, e1[2]/l1];
  diskE1 = e1;
  diskE2 = [n[1]*e1[2]-n[2]*e1[1], n[2]*e1[0]-n[0]*e1[2], n[0]*e1[1]-n[1]*e1[0]];
}
rebuildDiskBasis();

let pos, q, tau, gFactor;
let pgCell, pgRing, pgZ;   // per-particle polar-map indices + disk-frame height
let lastInsideCount = 0;
let lastAvgG = 1;

function vCircular(r) {
  // Circular speed for the SEED central mass GM0 with the grown RS pole — matches
  // the point-mass term in step() exactly, so respawned material orbits at the
  // speed the dynamics actually provide instead of being flung out (or dropped in)
  // by a hole that "created" mass through accretion. As RS grows toward r the
  // required speed rises (denominator shrinks), so the expanding horizon still
  // strips the inner disk; the far disk (r≫RS) stays at √(GM0/r), unchanged by
  // accretion. At g=1 (RS==RS0) this is the original √(GM0·r)/(r−RS).
  return Math.sqrt(GM0 * r) / (r - RS);
}
function celerityFromSpeed(v) {
  const gamma = 1 / Math.sqrt(Math.max(1e-9, 1 - v*v/(C*C)));
  return v * gamma;
}
function gaussianRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

///////////////////////////////////////////
// =====================================================================
// DISK RADIAL PROFILE  +  spawnParticle
// ---------------------------------------------------------------------
// Everything above spawnParticle() is module-scope state. buildDiskProfile()
// must be called once from initPhysics()/resetAll(), and again whenever
// bhSpin or R_SPAWN_MAX changes (the inner edge tracks the ISCO).
// =====================================================================

// ---- inner edge: the ISCO, not an arbitrary floor ---------------------------
// A thin disk has a real inner edge at the innermost stable circular orbit.
// Inside it there are no stable orbits at all, so material completes roughly one
// more revolution and plunges; the surface density falls by orders of magnitude
// rather than continuing to rise. Bardeen–Press–Teukolsky, prograde branch:
//   r_isco/M = 3 + Z2 - sqrt((3 - Z1)(3 + Z1 + 2 Z2))
// In these units M = GM = 0.5 and r_s = 1, so a* = 0 gives 3 r_s and the edge
// migrates inward with spin: 1.92 r_s at a* = 0.6, 1.16 at 0.9, 0.62 at 0.998.
function iscoRadius(aStar) {
  const a = Math.min(0.998, Math.max(0, aStar));
  const Z1 = 1 + Math.cbrt(1 - a*a) * (Math.cbrt(1 + a) + Math.cbrt(1 - a));
  const Z2 = Math.sqrt(3*a*a + Z1*Z1);
  return GM * (3 + Z2 - Math.sqrt(Math.max(0, (3 - Z1) * (3 + Z1 + 2*Z2))));
}

// ---- radial sampling profile ------------------------------------------------
// dN/d(ln r)  ∝  r^DISK_SAMPLING_INDEX · f(r) · ring(r),   f = 1 - sqrt(r_in/r)
//
// f is the zero-torque inner boundary condition: no stress can be transmitted
// across the ISCO, so dissipation (and surface density) vanish there. It is what
// gives the disk a soft inner edge instead of a wall, and it puts the emission
// peak at r = (49/36)·r_in ≈ 1.36 r_in, not at the edge itself.
//
// DISK_SAMPLING_INDEX is a sampling choice, not physics, and it is a genuine
// trade-off because every particle carries the same mass:
//   0     — log-uniform. Best inner-region resolution, but implies Σ ∝ r^-2,
//           steeper than any real disk, so the density map over-weights the
//           centre and self-gravity reads too concentrated.
//   1.25  — equal-mass sampling of a Shakura–Sunyaev outer-region disk
//           (Σ ∝ r^-3/4 ⇒ dN/dr ∝ r^1/4). Physically honest, but most particles
//           land far out where they are small and dim, and the inner disk goes
//           grainy at fixed N.
// 0.5 is a compromise. Set it to 1.25 if you care more about the self-gravity
// being right than about inner-region sampling density.
const DISK_SAMPLING_INDEX = 0.5;

// Outer taper. Without it the r^INDEX factor keeps rising and material piles up
// against R_SPAWN_MAX as a hard-edged wall. Real disks have no outer edge either:
// the Lynden-Bell & Pringle viscous similarity solution gives
// Σ ∝ r^-γ exp(-(r/R_c)^(2-γ)), so an exponential roll-off is the standard shape,
// and it lets R_SPAWN_MAX stay what it is -- a visibility cutoff, not a boundary.
const DISK_OUTER_TAPER = 0.55;   // × R_SPAWN_MAX = the roll-off radius R_c

// ---- ring structure ---------------------------------------------------------
// Rings in black-hole accretion art are mostly convention — a steady thin disk
// has a smooth Σ(r), and most "rings" in renders are lensing features (the
// photon ring, the secondary image of the far side) rather than real density
// structure. But narrow quasi-axisymmetric bands are a real phenomenon in
// accretion flows: MRI turbulence organises into zonal flows, and the
// radiation-pressure instability drives banded limit cycles in the inner disk.
// Protoplanetary disks show them unambiguously (ALMA/HL Tau). So: defensible as
// an evolved structure, not as a steady-state solution.
//
// Generated as a sum of Gaussian bumps in ln r rather than a 
// coordinate warp like r -> r + sin(a·r^(1+ε)), which would look too artificial.
// Roughly log-periodic spacing is deliberate: resonant and instability-driven
// structure tends to be self-similar in radius, not equally spaced in r.
const RING_COUNT = 6;
const RING_CONTRAST = 0.6;    // peak |amplitude|; 0 = smooth disk
const RING_MIN_CONTRAST = 0.3; // amplitudes never land near zero (invisible rings)
const ringLogCentre = new Float64Array(RING_COUNT);
const ringAmplitude = new Float64Array(RING_COUNT);
const ringInvWidth  = new Float64Array(RING_COUNT);  // reciprocal, so the hot loop divides never

const PROFILE_BINS = 384;
let diskInnerEdge = 3 * RS;
let profileLogMin = 0, profileLogSpan = 1;

// ---- sampling table ---------------------------------------------------------
// The CDF is inverted once at build time onto a uniform grid in u, so drawing a
// radius is a table lookup plus one lerp -- no binary search, no branch, no
// transcendental. This is the difference between a spawn costing ~10 ns and
// ~150 ns, which matters when a full disk regeneration is 50k+ calls.
const INVCDF_BINS = 1024;
const invCDFLogR = new Float64Array(INVCDF_BINS + 1);

// Compact quartic bump instead of exp(-d²/2): identical shape to the eye, zero
// outside |d| > 1, and no transcendental. The profile build is only ~2300 evaluations
function ringBump(d) {
  const a = d < 0 ? -d : d;
  if (a >= 1) return 0;
  const t = 1 - a*a;
  return t * t;
}

function ringModulation(lnR) {
  let m = 1;
  for (let k = 0; k < RING_COUNT; k++) {
    m += ringAmplitude[k] * ringBump((lnR - ringLogCentre[k]) * ringInvWidth[k]);
  }
  return m < 0.05 ? 0.05 : m;   // never let a gap go completely empty
}

// The profile is rebuilt lazily and at most once per dirty-flag flip.
let diskProfileDirty = true;
let profileBuiltRS = RS;   // the horizon scale the current profile was built at
let profileBuiltSpin = bhSpin;  // the spin the current profile (ISCO) was built at
function markDiskProfileDirty() { diskProfileDirty = true; }
function ensureDiskProfile() { if (diskProfileDirty) buildDiskProfile(); }

function buildDiskProfile() {
  diskProfileDirty = false;
  profileBuiltRS = RS;   // inner edge (ISCO) tracks GM, so remember what GM we baked in
  // R_SPAWN_MIN stays a hard floor; the ISCO takes over whenever it is larger.
  diskInnerEdge = Math.max(R_SPAWN_MIN, iscoRadius(bhSpin));
  profileLogMin = Math.log(diskInnerEdge);
  profileLogSpan = Math.log(R_SPAWN_MAX) - profileLogMin;

  // Rings: log-periodic skeleton, then jitter everything about it.
  //
  // Width is tied to the epicyclic smearing they have to survive. A velocity
  // perturbation of velNoise gives eccentricity e ~ 2*velNoise, i.e. a radial
  // excursion of +/- 2*velNoise in ln r, and any ring narrower than that is
  // erased inside the first orbit.
  // Amplitude keeps a minimum magnitude: drawing uniformly on [-A, A] put
  // several rings near zero contrast every time, so only two or three of nine
  // were ever visible.
  const cell = profileLogSpan / RING_COUNT;
  const smear = 2.0 * velNoise;
  for (let k = 0; k < RING_COUNT; k++) {
    ringLogCentre[k] = profileLogMin + cell * (k + 0.5) + (Math.random() - 0.5) * cell * 0.6;
    const mag = RING_MIN_CONTRAST + (RING_CONTRAST - RING_MIN_CONTRAST) * Math.random();
    ringAmplitude[k] = Math.random() < 0.5 ? -mag : mag;
    // quartic bump has compact support, so its half-width is the full extent
    const w = Math.max(cell * 0.55, smear * 1.6) * (0.85 + 0.4 * Math.random());
    ringInvWidth[k] = 1 / w;
  }

  // cumulative distribution over ln r, trapezoid rule
  const cdf = new Float64Array(PROFILE_BINS + 1);
  const rc = DISK_OUTER_TAPER * R_SPAWN_MAX;
  const invRc2 = 1 / (rc * rc);
  let prev = 0;
  for (let b = 0; b <= PROFILE_BINS; b++) {
    const lnR = profileLogMin + profileLogSpan * (b / PROFILE_BINS);
    const r = Math.exp(lnR);
    let f = 1 - Math.sqrt(diskInnerEdge / r);            // zero-torque edge
    if (f < 0) f = 0;
    const w = Math.pow(r, DISK_SAMPLING_INDEX) * f
            * Math.exp(-r * r * invRc2)                  // viscous outer roll-off
            * ringModulation(lnR);
    const wSafe = (w >= 0 && isFinite(w)) ? w : 0;
    if (b > 0) cdf[b] = cdf[b-1] + 0.5 * (prev + wSafe);
    prev = wSafe;
  }
  const total = cdf[PROFILE_BINS];

  // Degenerate-profile guard. This is not paranoia: a single NaN anywhere in the
  // weight (velNoise undefined at build time, R_SPAWN_MAX below the ISCO, spin
  // out of range) makes every comparison in the inversion below false, so src
  // never advances and t falls to 0 -- the whole table collapses to a single
  // value and every particle spawns at the same radius:
  // Fail loudly and fall back to the simple log-uniform distribution.
  if (!(total > 0) || !isFinite(total)) {
    for (let j = 0; j <= INVCDF_BINS; j++) {
      invCDFLogR[j] = profileLogMin + profileLogSpan * (j / INVCDF_BINS);
    }
    console.warn('buildDiskProfile: degenerate weight (total =', total,
                 ', innerEdge =', diskInnerEdge, ') — using log-uniform fallback.');
    return;
  }

  // Invert onto a uniform grid in u. Single forward walk, O(bins), done once.
  let src = 0;
  for (let j = 0; j <= INVCDF_BINS; j++) {
    const target = (j / INVCDF_BINS) * total;
    while (src < PROFILE_BINS && cdf[src + 1] < target) src++;
    const c0 = cdf[src], c1 = cdf[src + 1];
    const t = c1 > c0 ? (target - c0) / (c1 - c0) : 0;
    invCDFLogR[j] = profileLogMin + profileLogSpan * ((src + t) / PROFILE_BINS);
  }
}

// Draw a radius: one multiply, one truncation, one lerp, one exp. No search.
// The dirty-flag check lives HERE, at the point of use, so the table can never
// be read before it is built no matter who calls what in which order. An
// unbuilt table is zero-filled, and exp(0) = 1, so the failure mode is every
// particle spawning at r = 1 r_s and being clamped to SAFE_SPAWN_FLOOR --
// indistinguishable on screen from a deliberate thin ring.
function sampleDiskRadius() {
  if (diskProfileDirty) buildDiskProfile();
  const t = Math.random() * INVCDF_BINS;
  const i = t | 0;
  const f = t - i;
  return Math.exp(invCDFLogR[i] + f * (invCDFLogR[i + 1] - invCDFLogR[i]));
}

// Cheap normal deviate. Box-Muller costs a log, a cos and a sqrt; the sum of
// three uniforms has mean 1.5 and variance 1/4, so (sum - 1.5) * 2 is unit
// variance for three Math.random() calls and no transcendentals. Support is
// +/-3 sigma, which for scattering spawn positions is a feature: no runaway tail
// to be caught by the SAFE_SPAWN_FLOOR clamp below.
function fastGaussian() {
  return (Math.random() + Math.random() + Math.random() - 1.5) * 2;
}

// =====================================================================

function spawnParticle(i, init = true) {
  // Three modes, unchanged in intent:
  //   init && !sphericalSpawn  — disk, sampled from the profile above
  //   init && sphericalSpawn   — isotropic prograde cloud, same radial profile
  //   !init                    — respawn at the outer edge of a running sim

  // Respawn is spread over the outermost decade rather than dropped exactly on
  // R_SPAWN_MAX: a delta function there builds a visible shell of fresh material
  // that then sweeps inward as a coherent front. 
  // We need a pragmatic solution here. The idea is to spawn new particles "far out"
  // so the disk is not "replenished from nothing". But realistic temperature makes
  // the disk visible so far out that the "particle budget" is unreasonably diluted
  // so let's try respawning particles still far out, but "pre-smeared", so that 
  // an accreted ring doesn't translate to respawning a new discrete ring (which would lead
  // to an unphysical feedback loop of infalling rings).
  // So, let's try exp(-a*random), the spread is in ln r so it matches the profile's own measure.

  const r = init
    ? sampleDiskRadius()
    : R_SPAWN_MAX * Math.exp(-0.2 * Math.random());
  const vmag = vCircular(r);

  let x, y, z, vx, vy, vz;
  if (sphericalSpawn) {
    // isotropic cloud: random point on the sphere of radius r, with a circular
    // orbit in a randomly oriented plane. This populates all inclinations so the
    // Kerr frame-dragging (nodal precession of tilted orbits) becomes visible.
    const u = Math.random()*2 - 1, phi = Math.random()*Math.PI*2;
    const s = Math.sqrt(Math.max(0, 1 - u*u));
    const rx = s*Math.cos(phi), ry = u, rz = s*Math.sin(phi);   // unit radial
    x = r*rx; y = r*ry; z = r*rz;
    // velocity perpendicular to r, in a random orbital-plane orientation
    let tx = Math.random()*2-1, ty = Math.random()*2-1, tz = Math.random()*2-1;
    const d = tx*rx + ty*ry + tz*rz;
    tx -= d*rx; ty -= d*ry; tz -= d*rz;
    let tl = Math.hypot(tx, ty, tz);
    if (tl < 1e-3) { tx = -rz; ty = 0; tz = rx; tl = Math.hypot(tx, ty, tz) || 1; } // r∥random guard
    // Single handedness: all inclinations are populated, but every orbit is
    // prograde about the spin/disk axis. L = r x v, so requiring L·n̂ > 0 and
    // flipping the tangent otherwise.
    const lDotN = (ry*tz - rz*ty)*diskNormal[0]
                + (rz*tx - rx*tz)*diskNormal[1]
                + (rx*ty - ry*tx)*diskNormal[2];
    if (lDotN < 0) { tx = -tx; ty = -ty; tz = -tz; }
    vx = vmag*tx/tl; vy = vmag*ty/tl; vz = vmag*tz/tl;
  } else {
    const az = Math.random() * Math.PI * 2;
    x = r * Math.cos(az); y = 0; z = r * Math.sin(az);
    // orbital direction inverted (vs the naive -sin/+cos tangent) purely
    // conventional, so the disk's north pole faces up in the default view
    vx = Math.sin(az) * vmag; vy = 0; vz = -Math.cos(az) * vmag;
  }

  // Vertical scatter is scaled to h/r rather than r so the disk keeps a constant
  // opening angle; in-plane scatter would smear the rings straight back out, so
  // it is applied only along the disk normal for the flat spawn. The spherical
  // mode has no plane to preserve, so it keeps the isotropic jitter.
  if (sphericalSpawn) {
    x += fastGaussian() * posNoise * r;
    y += fastGaussian() * posNoise * r;
    z += fastGaussian() * posNoise * r;
  } else {
    const jz = fastGaussian() * posNoise * r;
    x += jz * diskNormal[0];
    y += jz * diskNormal[1];
    z += jz * diskNormal[2];
  }

  vx += fastGaussian() * velNoise * vmag;
  vy += fastGaussian() * velNoise * vmag;
  vz += fastGaussian() * velNoise * vmag;

  // hard safety clamp: regardless of how far the Gaussian tail pushed the
  // radius inward, never let a particle spawn below the floor. Preserves
  // direction, just pushes the radius back out.
  const rNoisy = Math.hypot(x, y, z);
  if (rNoisy < SAFE_SPAWN_FLOOR) {
    const scale = SAFE_SPAWN_FLOOR / Math.max(rNoisy, 1e-6);
    x *= scale; y *= scale; z *= scale;
  }

  pos[i*3+0] = x; pos[i*3+1] = y; pos[i*3+2] = z;

  const speedMag = Math.hypot(vx, vy, vz);
  const cel = celerityFromSpeed(Math.min(speedMag, 0.999 * C));
  const norm = speedMag || 1;
  q[i*3+0] = (vx/norm) * cel;
  q[i*3+1] = (vy/norm) * cel;
  q[i*3+2] = (vz/norm) * cel;

  tau[i] = 0;
}

///////////////////////////////////////////

function initPhysics() {
  buildDiskProfile();
  pos = new Float32Array(N*3);
  q = new Float32Array(N*3);
  tau = new Float32Array(N);
  gFactor = new Float32Array(N).fill(1);
  pgCell = new Int32Array(N).fill(-1);
  pgRing = new Int32Array(N).fill(-1);
  pgZ = new Float32Array(N);
  for (let i = 0; i < N; i++) spawnParticle(i);
}

function step(dt) {
  let insideCount = 0, gSum = 0;

  // Kerr horizon (oblate spheroid; spin ∥ diskNormal = y). Outer horizon
  // r₊ = M + √(M²−a²) shrinks with spin; equatorial radius √(r₊²+a²) exceeds
  // the polar radius r₊. Reduces exactly to the sphere r=RS at a=0. Used below
  // for the redshift/throttle term and the hard absorption check, so polar
  // material falls deeper before fading than equatorial material does.
  const aLenH = bhSpin * GM;
  const rPlusH = GM + Math.sqrt(Math.max(0, GM*GM - aLenH*aLenH));
  const hEq2 = rPlusH*rPlusH + aLenH*aLenH; // equatorial radius²  (= RS² at a=0)
  const hPol2 = rPlusH*rPlusH;              // polar radius²       (= RS² at a=0)
  const kerrHorizon = bhSpin > 0;

  // Per-particle mass in internal units (same convention as M_BH = GM), used to
  // accrete angular momentum on absorption below. Same physical particle whose
  // kg-equivalent (currentParticleMassKg) drives the mass growth — just the
  // internal-unit form needed for a* = J/GM².
  const mPartInternal = diskMassInternal() / Math.max(1, N);

  //particle mechanics:
  // todo: more sophisticated viscosity, disk bias, falling-in trajectories
  // also includes an approximation of Kerr metric frame-dragging (nice to have, but gives no perceptible result, you'd have to track a given particle for a couple of orbits for this to become apparent).
  for (let i = 0; i < N; i++) {
    const ix = i*3;
    const px = pos[ix], py = pos[ix+1], pz = pos[ix+2];
    const r = Math.hypot(px, py, pz);
    const insideHitbox = r < R_HITBOX;

    // g = dτ/dt computed from START-of-step state (before this step's own
    // force is applied) — this is the coordinate/proper-time conversion
    // factor used below to throttle both the momentum and position updates.
    // Without this, the sim silently treated coordinate time t and proper
    // time τ as the same thing, which is why infalling particles used to
    // just plunge and vanish instead of visibly slowing/redshifting first.
    const qx0 = q[ix], qy0 = q[ix+1], qz0 = q[ix+2];
    const qMag0 = Math.sqrt(qx0*qx0 + qy0*qy0 + qz0*qz0);
    const gamma0 = Math.sqrt(1 + qMag0*qMag0 / (C*C));
    const vx0 = qx0/gamma0, vy0 = qy0/gamma0, vz0 = qz0/gamma0;
    const speedFrac0 = Math.hypot(vx0, vy0, vz0) / C;
    // horizon-proximity term. At a=0 this is RS/r (spherical). Under spin it
    // becomes rH(dir)/r for the oblate horizon, i.e. 1/√(ρ²/r_eq² + y²/r_pol²),
    // so the lapse collapses on the oblate surface, not a sphere.
    let horizonTerm;
    if (kerrHorizon) {
      const rho2h = px*px + pz*pz; // equatorial distance² (spin ∥ y)
      horizonTerm = 1 / Math.sqrt(Math.max(1e-12, rho2h/hEq2 + (py*py)/hPol2));
    } else {
      horizonTerm = RS / Math.max(r, 1e-6);
    }
// dτ/dt factorises: gravitational lapse × local Lorentz factor. The old
    // additive form (1 - r_s/r - v²) is the weak-field expansion of this, missing
    // the (r_s/r)v² cross term — so it reaches zero at finite radius (r = 2 r_s
    // for free fall, 1.5 r_s for a circular orbit) and the g-throttled position
    // update stalls particles there, short of R_INNER_KILL. The product vanishes
    // only at the horizon itself, which is the frozen-star behaviour we want.
    const gGrav = Math.max(0, 1 - horizonTerm);
    const gKin  = Math.max(0, 1 - speedFrac0*speedFrac0);
    const g = Math.sqrt(Math.max(1e-6, gGrav * gKin));
    gFactor[i] = g;
    tau[i] += g * dt;

    let accelMag;
    if (insideHitbox) {
      const rSafe = Math.max(r - RS, 0.05);
      accelMag = GM0 / (rSafe*rSafe);
    } else {
      accelMag = GM0 / Math.max(r*r, 1e-6);
    }
    let invR3term = accelMag / Math.max(r, 1e-6);

    // --- accretion mass conservation --------------------------------------------
    // accelMag above uses the seed mass GM0, not the accretion-grown GM. Rationale:
    // the mass booked into GM by accretion was disk material already interior to
    // these orbits, and — because absorbed particles respawn at the outer edge — it
    // recycles straight back into the disk monopole below. Letting it inflate the
    // central attraction would double-count it and spuriously speed up the whole
    // disk as the hole grows (outer orbits suddenly sub-Keplerian, sinking in for
    // no physical reason). Using GM0 with the grown RS pole keeps the far field at
    // the conserved value GM0/r² while the (larger) horizon still swallows material
    // geometrically: the hole gains on the disk via an expanding RS, not via a
    // rising pull. Its PW-ISCO sits at 3·RS (grown), matching the spawn inner edge.

    // Disk monopole: the enclosed disk mass pulls like extra central mass. Newton's
    // shell result does not hold for a flattened body, but inside a thin disk the
    // enclosed-mass approximation is the standard first cut and it is what makes
    // k_disk mean "how much does the disk's gravity matter next to the hole's".
    // Held at the SEED disk-mass budget (× GM0/GM) so it, too, does not inflate as
    // the nominal disk mass (k·GM) tracks the growing hole. With the seed-mass point
    // term above, M_eff(r) → GM0 + seed·disk(<r): conserved under the disk→BH
    // transfer, so orbital speeds stay attuned to the mass that was always interior.
    if (kDisk > 0) {
      invR3term += enclosedDiskMass(r) * (GM0 / GM) / Math.max(r*r*r, 1e-12);
    }

    let ax = -px * invR3term;
    let ay = -py * invR3term;
    let az = -pz * invR3term;

    // ---- disk self-gravity: vertical pull toward the MEASURED disk plane -----
    // Replaces the old ad-hoc harmonic bias. For a thin sheet of surface density
    // Sigma the vertical field just off the plane is 2*pi*G*Sigma, independent of
    // height -- so the profile is flat outside the disk and linear inside it,
    // which is exactly tanh(z/h). Sigma comes from the polar map and h from that
    // ring's <z^2>, so both are measured per frame.
    if (pgCell[i] >= 0 && (kDisk > 0 || dragStrength > 0)) {
      const nrm = diskNormalLive;
      let aV = 0;
      // (a) CONSERVATIVE: the disk's own vertical gravity. Genuinely weak unless
      //     the disk is a sizeable fraction of M_BH 
      //     so  the slider will only have a significant effect  in its upper range.
      if (kDisk > 0) {
        aV -= TWO_PI * pgSigma[pgCell[i]] * Math.tanh(pgZ[i] / pgRingH[pgRing[i]]);
      }
      // (b) DISSIPATIVE: viscous settling, and the term that actually flattens the
      //     disk. For a point-mass potential the vertical epicyclic frequency is
      //     just the orbital frequency, so damping at 2*zeta*Omega gives a settling
      //     time of a fixed number of orbits at every radius rather than a fixed
      //     number of ticks, the inner disk flattens first (as it should).
      if (dragStrength > 0) {
        const omega = Math.sqrt(GM / Math.max(r*r*r, 1e-12));
        const qh = qx0*nrm[0] + qy0*nrm[1] + qz0*nrm[2];
        aV -= 2.0 * DISK_SETTLE_ZETA * dragStrength * omega * qh;
      }
      ax += aV * nrm[0];
      ay += aV * nrm[1];
      az += aV * nrm[2];
    }

    // viscosity/drag heuristic: proportional to velocity at the start of this
    // step, scaled by the coarse local density built once per frame.
    if (dragStrength > 0) {
      // Radial profile (smooth background, unchanged and already tuned) times the
      // local azimuthal contrast from the polar map: a particle sitting in a clump
      // or an arm sees denser gas than the ring average and drags harder, which is
      // the whole point of keeping an (R,phi) map rather than a radial histogram.
      const contrast = pgCell[i] >= 0 ? pgContrast[pgCell[i]] : 1;
      const localDensity = dragBinDensityNorm[densityBinIndex(r)] * contrast;
      const dragScale = -dragStrength * DRAG_SCALE * localDensity;
      ax += dragScale * vx0;
      ay += dragScale * vy0;
      az += dragScale * vz0;
    }

    // Kerr frame-dragging (gravitomagnetic) — the leading, linear-in-spin effect.
    // Skipped for a==0 (Schwarzschild case).
    /* 
    The rotating BH drags spacetime via a dipole gravitomagnetic field:
	     B_g = (2·GM·a_len/r³)[3(Ŝ·r̂)r̂ − Ŝ] 
     about the spin axis Ŝ (= disk normal); the velocity-dependent force a_gm = −v×B_g does no work (⊥ v). 
     This is the leading term: in the equatorial plane the Kerr potential g_tt is unchanged by spin, so there is nothing to add there — the spin enters only through this off-diagonal (frame-dragging) piece. a_len = a·GM.
    */
    if (bhSpin > 0) {
      const aLen = bhSpin * GM;                       // length spin a = a*·M (G=1 ⇒ M=GM)
      const coef = 2 * GM * aLen / (r*r*r);           // = 2·GM²·a*/r³, fixed in internal units
      const sdotr = (px*diskNormal[0] + py*diskNormal[1] + pz*diskNormal[2]) / Math.max(r, 1e-6);
      const bgx = coef * (3*sdotr*px/r - diskNormal[0]);
      const bgy = coef * (3*sdotr*py/r - diskNormal[1]);
      const bgz = coef * (3*sdotr*pz/r - diskNormal[2]);
      ax -= (vy0*bgz - vz0*bgy);   // a_gm = −v × B_g  (start-of-step velocity)
      ay -= (vz0*bgx - vx0*bgz);
      az -= (vx0*bgy - vy0*bgx);
    }

    // convert the proper-time force law (what the PW potential and the
    // heuristic terms above naturally express) into a coordinate-time rate:
    // dq/dt = (dτ/dt)(dq/dτ) = g * a. 
    //Outside the hitbox g ≈ 1, this only matters where g deviates from 1.
    ax *= g; ay *= g; az *= g;

    q[ix]   += ax * dt;
    q[ix+1] += ay * dt;
    q[ix+2] += az * dt;

    const qx = q[ix], qy = q[ix+1], qz = q[ix+2];
    const qMag2 = qx*qx + qy*qy + qz*qz;
    const gamma = Math.sqrt(1 + qMag2 / (C*C));
    const vx = qx / gamma, vy = qy / gamma, vz = qz / gamma;

    // same conversion for position: dx/dt = g * v. Using the SAME start-of-
    // step g as above (not a freshly recomputed one) for internal consistency
    // within a single step.
    let nx = px + g*vx*dt, ny = py + g*vy*dt, nz = pz + g*vz*dt;
    const nr = Math.hypot(nx, ny, nz);

    if (insideHitbox) { insideCount++; gSum += g; }

    // Blackout temperature now uses the LIVE temp0K:
    // the slider is deliberately allowed to affect absorption, but the absorption
    // branch below only fires INSIDE R_INNER_KILL, where all material is
    // assumed to be infalling.
    const tBlackout = temp0K * Math.pow(Math.max(r, 1e-3), -0.75) * g;

    let breached;
    if (kerrHorizon) {
      breached = (nx*nx + nz*nz)/hEq2 + (ny*ny)/hPol2 <= 1.0; // inside oblate horizon
    } else {
      breached = nr <= RS;
    }
    if (breached) {
      // emergency despawn — unconditional inner removal. Ordinarily should never fire.
      horizonBreachCount++;
      absorbedCount++;
      accretedMassKg += currentParticleMassKg;
      bhAngMomInternal += mPartInternal * (nz*qx - nx*qz);   // L_y = (r × u)_y
      spawnParticle(i, false);
    } else if (nr < R_INNER_KILL && tBlackout < T_CUTOFF_K) {
      // accretion: absorbed only when *both* inside R_INNER_KILL and blacked out.
      // R_INNER_KILL is no longer an unconditional kill radius — it's just the
      // outer bound within which blackout is even tested. Cold material outside
      // this radius (far & dim, but g≈1 and not infalling) is retained and left
      // to escape and recycle at R_ESCAPE. Strictly inside 1.3 r_s here, so
      // everything is genuinely infalling: near the horizon g collapses, driving
      // tBlackout → 0 regardless of temp0K, so absorption still happens even at
      // low slider values (no permanent freeze / performance sink at the horizon).
      accretedMassKg += currentParticleMassKg;
      bhAngMomInternal += mPartInternal * (nz*qx - nx*qz);   // L_y = (r × u)_y, u = celerity
      absorbedCount++;
      spawnParticle(i, false);
    } else if (nr > R_ESCAPE) {  // respawn escaped particles
      escapeRecycleCount++;
      spawnParticle(i, false);
    } else {
      pos[ix] = nx; pos[ix+1] = ny; pos[ix+2] = nz;
    }
  }

  lastInsideCount = insideCount;
  lastAvgG = insideCount > 0 ? gSum / insideCount : 1;
}

// =====================================================================
// LENSING 
// mostly moved to shader code (particleVertexShader, duplicated in starVertexShader)
// compute a 3D "apparent world position" per particle (by projecting into camera space, bending, then unprojecting back out). The project/unproject pair is self-consistent by construction, it's algebraically identical to three.js's own perspective projection (the aspect-ratio term cancels), so there's no drift between this JS calc and what the GPU actually draws.
// =====================================================================

// Deflection normalization. The deflection formula converges to the exact GR
// weak-field value 2·r_s/b precisely at 1.0, so this is the single physical value
// (any other breaks the weak-field limit).
// used to be a cheat slider, now just kept as a named constant, the shader plumbing (uLensStrength) stays a harmless ×1.
const lensStrength = 1.0;

// =====================================================================
// HIGHER-ORDER LENSED IMAGES 
// Closed-form position of a point source's order-k image (strong-deflection limit, Bozza 2002). 
// Positions are a GR approximation; brightness is heuristic (cheat), tunable per-order log-brightness offsets below.
// =====================================================================

const B_BAR = Math.log(216 * (7 - 4*Math.sqrt(3))) - Math.PI; // ≈ -0.4003
// draw orders 1 and 2 (order 0 uses the thin-lens solve below)
// orders 3 and higher add very subtle additional rings, in practice no longer discernible from order 5 or so.
const MAX_IMAGE_ORDER = 2;

// Order-0 (direct-image) thin-lens solve and the deflection-angle formula now
// live only in the vertex shaders (solvePrimaryTheta / deflectionAngle in GLSL);
// the JS copies were retired with the JS-path k=0 rendering.

// hoBrightness: per-order brightness as additive log10 offsets (our brightness pipeline is already logarithmic). 
// 0.6 -> log10(0.6)≈-0.222; 0.2 -> log10(0.2)≈-0.699.
// These are the tunable "cheat" — physically each order dims by ~e^-π≈0.04,
// hoBrightness is the "keep" fraction per order, stacked multiplicatively:
// order k is scaled by hoBrightness^k, i.e. offset by k*log10(hoBrightness) dex.
// hoBrightness=1 means no reduction; nothing ever reaches exactly zero, so no
// order winks out abruptly. (The old linear form max(0, 1-k*(1-h)) extinguished
// order k at h = 1-1/k — order 2 at h=0.5 — which was the k=2 disappearance bug.)
let hoBrightness = 0.04;

// ---- observer clock --------------------------------------------------------
// Simulation time IS the camera's proper time. The integrator advances
// COORDINATE time (the clock of a static observer at infinity), and
// dt_coord/dτ_cam = 1/lapse(r_cam), so a camera deep in the well must step
// coordinate time faster: the whole disk speeds up. Same gate and sentinel as
// the shader terms, computed once per frame so both stay consistent.
let obsRsOverRcam = 0.0;   // 0 = remote-camera sentinel
let obsTimeRate   = 1.0;   // dt_coord / dτ_cam = 1/√(1 − r_s/r_cam)

// NOTE: the live higher-order brightness falloff now runs in the vertex shader
// (uHoBright uniform). This JS version is kept as the reference formula:
//function orderBrightnessScale(k) {return Math.pow(hoBrightness, k);}
let ringImagesEnabled = true;   // toggle the per-particle higher-order images

// SR Doppler + relativistic beaming 
// (velocity-based; camera-relative, rendering-only, never feeds despawn). 
let dopplerEnabled = true;
// ---- display policy for physical brightness -> rgb -------------------------
// Purely a rendering choice: which window of log10(visible-band luminosity)
// gets the available sub-white rgb range, and where we give up and go white.
// The disk spans ~12 decades (log10 L_vis ~ +2.4 at r=2.5 down to -10 at r=40),
// so the window has to be chosen, not defaulted.
let brightLo = -6.0;      // black point
let brightHi = 8.0;       // full scale
let whiteoutKnee = 0.75;  // display level where colour starts washing to white
let brightGamma = 0.8;    // <1 flattens brightness differences (lifts faint detail)
let falseAmt = 0.2;       // strength of the cold-particle false-colour floor
let falseDark = 0.4;      // finished r+g+b below which a particle counts as "dark"
let falseColdK = 3000;    // LOCAL REST temperature below which it counts as "cold"
const FALSE_COLOR = [0.5, 0.5, 0.5];   // the baseline false colour itself
let sizeGain = 0.25;       // 0 = fixed sprite size (previous behaviour)
let beamingC = 3;             // δ^C beaming exponent. Physically ~3-4, but that's neither here nor there as long as we don't have a unified approach to representing brightness.

let betaDopplerCutoff = 0.05;   // skip Doppler for particles slower than this (|β|); 
				// just for minor performance gain, Doppler shift is mostly imperceptible below 0.05.
				//the visible disk should run from about β≈0.09 (outer) to ≈0.6 (inner), but particles in the far outer disk are affected by this

function alphaForOrder(k, psi) {
  return (k % 2 === 1) ? k*Math.PI - psi : (k-1)*Math.PI + psi;
}
function impactParamForAlpha(alpha) {
  return B_CRIT * (1 + Math.exp(B_BAR - alpha));
}

function getCameraFrame(camera, H) {
  camera.updateMatrixWorld();
  const e = camera.matrixWorld.elements;
  const right = new THREE.Vector3(e[0], e[1], e[2]).normalize();
  const up    = new THREE.Vector3(e[4], e[5], e[6]).normalize();
  const fwd   = new THREE.Vector3(-e[8], -e[9], -e[10]).normalize(); // camera looks down local -Z
  const vFovRad = THREE.MathUtils.degToRad(camera.fov);
  const focal = (H / 2) / Math.tan(vFovRad / 2);
  return { camPos: camera.position.clone(), right, up, fwd, focal };
}

// project a world point into (screenX, screenY, cameraSpaceDepth); null if behind camera
function projectToScreen(wx, wy, wz, frame, W, H) {
  const relx = wx - frame.camPos.x, rely = wy - frame.camPos.y, relz = wz - frame.camPos.z;
  const xc = relx*frame.right.x + rely*frame.right.y + relz*frame.right.z;
  const yc = relx*frame.up.x    + rely*frame.up.y    + relz*frame.up.z;
  const zc = relx*frame.fwd.x   + rely*frame.fwd.y   + relz*frame.fwd.z;
  if (zc <= 0.01) return null;
  return {
    x: W/2 + (xc/zc) * frame.focal,
    y: H/2 - (yc/zc) * frame.focal,
    z: zc
  };
}

// inverse of projectToScreen: screen pixel + camera-space depth -> world position
const _tmpApparent = new THREE.Vector3();
function unprojectApparent(screenX, screenY, zc, frame, W, H, out) {
  const xc = (screenX - W/2) * zc / frame.focal;
  const yc = (H/2 - screenY) * zc / frame.focal;
  out.copy(frame.camPos)
     .addScaledVector(frame.right, xc)
     .addScaledVector(frame.up, yc)
     .addScaledVector(frame.fwd, zc);
  return out;
}

function buildCircle(radius, axis) {
  const segs = 96;
  const positions = new Float32Array((segs + 1) * 3);
  for (let s = 0; s <= segs; s++) {
    const a = (s / segs) * Math.PI * 2;
    if (axis === 'xz') {
      positions[s*3+0] = radius * Math.cos(a);
      positions[s*3+1] = 0;
      positions[s*3+2] = radius * Math.sin(a);
    } else if (axis === 'yz') {
      positions[s*3+0] = 0;
      positions[s*3+1] = radius * Math.cos(a);
      positions[s*3+2] = radius * Math.sin(a);
    } else {
      positions[s*3+0] = radius * Math.cos(a);
      positions[s*3+1] = radius * Math.sin(a);
      positions[s*3+2] = 0;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  return geo;
}
