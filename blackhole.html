// ===== Kerr critical curve (n→∞ photon-ring shape) as a per-frame LUT =====
/*
Bardeen's spherical-photon-orbit conserved quantities ξ(r), η(r) parametrize the shadow boundary for an observer at inclination θo. We reduce that curve to r_crit(φ), viz. impact parameter as a function of image-plane azimuth, and upload it as a 1×N  float texture the higher-order shader samples to warp the ring onto the correct offset/D-shape. 
At a=0 the LUT is flat at b_crit, i.e. a circle (Schwarzschild case).
*/
const CRIT_LUT_N = 128;
const critLUTData = new Float32Array(CRIT_LUT_N * 4);
for (let i = 0; i < CRIT_LUT_N; i++) critLUTData[i*4] = B_CRIT; // start as a circle
const critLUTTex = new THREE.DataTexture(critLUTData, CRIT_LUT_N, 1, THREE.RGBAFormat, THREE.FloatType);
critLUTTex.magFilter = THREE.LinearFilter;
critLUTTex.minFilter = THREE.LinearFilter;
critLUTTex.wrapS = THREE.RepeatWrapping;     // φ wraps at 0 / 2π
critLUTTex.needsUpdate = true;
let critLUTSpin = -1, critLUTTheta = -999, critLUTBcrit = -1;   // dirty-check cache: spin, inclination, hole scale

function kerrXiEta(r, a) {
  const xi  = (r*r*(3*GM - r) - a*a*(r + GM)) / (a*(r - GM));
  const eta = r*r*r*(4*GM*a*a - r*(r-3*GM)*(r-3*GM)) / (a*a*(r-GM)*(r-GM));
  return [xi, eta];
}
const _critPhi = [], _critR = [];
// Rebuild r_crit(φ) for the current spin a* and observer inclination θo (radians
// from the spin axis). Skips work when neither changed appreciably.
function updateCritLUT(bhSpin, thetaO) {
  // Rebuild when spin, inclination, OR the hole's SCALE changes. The scale term is
  // essential once the hole can grow: the whole critical curve (and the a=0 circle)
  // ∝ GM, i.e. ∝ B_CRIT, but uRs/uBcrit are pushed to the shaders live every frame.
  // A LUT frozen at an old scale — which happens whenever spin holds still while
  // accretion continues, most obviously once a* pins at the 0.998 cap — leaves the
  // LUT's rcrit out of sync with the live uRs in higherOrderDir, and the higher-
  // order images blow up into a 1:1 copy of the disk. Refresh on B_CRIT drift too.
  if (Math.abs(bhSpin - critLUTSpin) < 1e-4 &&
      Math.abs(thetaO - critLUTTheta) < 0.5*Math.PI/180 &&
      Math.abs(B_CRIT - critLUTBcrit) < 0.005*critLUTBcrit) return;
  critLUTSpin = bhSpin; critLUTTheta = thetaO; critLUTBcrit = B_CRIT;
  if (bhSpin < 1e-4) {  // Scharzschild case
    for (let i = 0; i < CRIT_LUT_N; i++) critLUTData[i*4] = B_CRIT; // restore circle (seems wasteful, just give the shader a "Schwarzschild pass" that skips this entirely?)
    critLUTTex.needsUpdate = true; return;
  }
  const a = bhSpin * GM;
  const th = Math.max(thetaO, 2*Math.PI/180), s = Math.sin(th), c = Math.cos(th), cot = c/s;
  const rPlus = GM + Math.sqrt(Math.max(0, GM*GM - a*a));
  const rlo = rPlus + 1e-4, rhi = GM*15, Ns = 1200;
  _critPhi.length = 0; _critR.length = 0;
  for (let i = 0; i <= Ns; i++) {
    const r = rlo + (rhi - rlo)*i/Ns;
    const [xi, eta] = kerrXiEta(r, a);
    const arg = eta + a*a*c*c - xi*xi*cot*cot;   // β² ≥ 0 gates the physical range
    if (arg < 0) continue;
    const al = -xi/s, be = Math.sqrt(arg), rc = Math.hypot(al, be);
    _critPhi.push((Math.atan2(be, al) + 2*Math.PI) % (2*Math.PI)); _critR.push(rc);
    if (be > 1e-9) { _critPhi.push((Math.atan2(-be, al) + 2*Math.PI) % (2*Math.PI)); _critR.push(rc); }
  }
  const idx = _critPhi.map((_, k) => k).sort((p, q) => _critPhi[p] - _critPhi[q]);
  const ph = idx.map(k => _critPhi[k]), rr = idx.map(k => _critR[k]);
  const NP = ph.length;

  // Coverage guard. The spherical-photon-orbit parametrization only yields points
  // where β² ≥ 0; at small a* (and, less severely, near pole-on) that band is a
  // thin arc clustered in azimuth, leaving large φ gaps the interpolation below
  // would fill with garbage — or, at a* ≲ 0.003, ZERO points and a NaN LUT. That
  // is the "spin-up from a*=0" artifact: a hole growing out of Schwarzschild
  // creeps through this sparse band during its first moments of accretion, the
  // higher-order images read a broken rcrit and balloon into a 1:1 copy of the
  // disk, and it only clears once a* leaves the band (hence starting at finite
  // spin, or nudging the slider, never shows it). Whenever coverage is poor the
  // true critical curve is near-circular anyway, so fall back to a uniform ring
  // at the mean valid radius — which stays correct even for the shrunken pole-on
  // shadow at high spin (mean radius, not the a=0 b_crit). b_crit only when there
  // are literally no points to average.
  let maxGap = NP >= 2 ? (ph[0] + 2*Math.PI - ph[NP-1]) : 2*Math.PI; // wrap-around gap
  for (let i = 1; i < NP; i++) maxGap = Math.max(maxGap, ph[i] - ph[i-1]);
  if (NP < 2 || maxGap > 40*Math.PI/180) {
    const rUniform = NP > 0 ? rr.reduce((s, v) => s + v, 0) / NP : B_CRIT;
    for (let i = 0; i < CRIT_LUT_N; i++) critLUTData[i*4] = rUniform;
    critLUTTex.needsUpdate = true; return;
  }

  for (let i = 0; i < CRIT_LUT_N; i++) {
    const phi = 2*Math.PI*(i + 0.5)/CRIT_LUT_N; // texel centre
    let val;
    if (phi <= ph[0] || phi >= ph[NP-1]) {       // wrap segment across φ=0
      const a0 = ph[NP-1] - 2*Math.PI, f = (phi - a0) / ((ph[0] - a0) || 1);
      val = rr[NP-1] + (rr[0] - rr[NP-1])*f;
    } else {
      let lo = 0, hi = NP - 1;
      while (hi - lo > 1) { const m = (lo+hi)>>1; if (ph[m] <= phi) lo = m; else hi = m; }
      const f = (phi - ph[lo]) / ((ph[hi] - ph[lo]) || 1);
      val = rr[lo] + (rr[hi] - rr[lo])*f;
    }
    critLUTData[i*4] = val;
  }
  critLUTTex.needsUpdate = true;
}

function buildParticleSystem() {

  particleGeometry.setAttribute('aVel',       new THREE.BufferAttribute(q, 3).setUsage(THREE.DynamicDrawUsage));

  // instanced attribute: which image order (0,1,2), one value per instance
  const orders = new Float32Array(MAX_IMAGE_ORDER + 1);
  for (let k = 0; k <= MAX_IMAGE_ORDER; k++) orders[k] = k;
  particleGeometry.setAttribute('aInstanceOrder', new THREE.InstancedBufferAttribute(orders, 1));
  particleGeometry.instanceCount = MAX_IMAGE_ORDER + 1; // adjusted per-frame by the ring toggle

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: dotTexture },
      tempLUT: { value: tempLUT },
      uAttenScale: { value: H * 0.9 },
      uCamPos: { value: new THREE.Vector3() },
      uBcrit: { value: B_CRIT },
      uBbar: { value: B_BAR },
      uRs: { value: RS },
      uHoBright: { value: hoBrightness },
      uPBaseSize: { value: P_BASE_SIZE },
      uHoPixelSize: { value: HO_PIXEL_SIZE },
      uHoRefDist: { value: HO_REF_DIST },
      uBhSpin: { value: bhSpin },
      uCritLUT: { value: critLUTTex },
      uTemp0K: { value: temp0K },
      uLensStrength: { value: lensStrength },
      uDopplerOn: { value: dopplerEnabled ? 1 : 0 },
      uBetaCut: { value: betaDopplerCutoff },
      uBeamC: { value: beamingC },
      uShowLensHi: { value: 0 },
      uShowInsideHi: { value: 0 },
      uRHitbox: { value: R_HITBOX },
      uRsOverRcam: { value: 0.0 },  // 0 = remote-camera sentinel; see shader
      uBrightLo: { value: brightLo },
      uBrightHi: { value: brightHi },
      uWhiteout: { value: whiteoutKnee },
      uBrightGamma: { value: brightGamma },
      uFalseAmt: { value: falseAmt },
      uFalseDark: { value: falseDark },
      uFalseColdK: { value: falseColdK },
      uFalseColor: { value: new THREE.Vector3(...FALSE_COLOR) },
      uSizeGain: { value: sizeGain }
    },
    vertexShader: particleVertexShader,
    fragmentShader: particleFragmentShader,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending
  });
  particleSystem = new THREE.Points(particleGeometry, material);
  particleSystem.frustumCulled = false;
  scene.add(particleSystem);
}

// =====================================================================
// STAR: an extended object (SphereGeometry) on a fixed Keplerian orbit.
// This is the first thing to use the absolute physical scale (bhMassSolar):
// orbit and radius are specified in AU / solar radii and converted to the
// internal length unit (= r_s). 
// gets its own shader for per-vertex operation, but the shader logic is
// just copied over from the particle shader.
// =====================================================================

const RSUN_KM = 696000;
// 1 internal length unit (= r_s) expressed in physical units, at the current M_BH:
function kmPerInternal()  { return RS_KM_PER_MSUN * bhMassSolar; }
function auPerInternal()  { return kmPerInternal() / 1.496e8; }

const star = {
  aAU: 1.0,          // semi-major axis (AU)
  e: 0.3,            // eccentricity
  iDeg: 10,          // inclination (deg) from the disk plane, about the +x (node) line
  radiusRsun: 1.0,   // stellar radius (R☉)
  massMsun: 1.0,     // stellar mass (M☉) — nominal; only used for the tidal limit
  tempK: 5800,       // surface temperature (K)
  visible: true,
  mesh: null,
  meanAnomaly: 0     // advanced by the Keplerian mean motion each frame
};

// Tidal (Roche-ish) disruption radius in internal units: r_t ≈ R_*(M_BH/M_*)^{1/3}.
// The star's periapsis must stay outside SAFETY× this so it can never enter the
// tidally-unsafe region.
// This is just for "suspension of disbelief", of course nothing would happen if the star entered a tidally unsafe region, it would just be unrealistic that nothing happens to it.
const TIDAL_SAFETY = 1.1;
// When the star sits nearly exactly behind the BH, per-vertex primary-image
// lensing wraps its mesh into a ring around the shadow and the triangles bridge
// across it. We hide the star within STAR_HIDE_FACTOR × (its angular radius) of
// the BH center. Bridging occurs for COM offset ≲ 1.15·θ_star.
// 2.5 is a safe margin that still shows the legitimate lensed arc at wider offsets; 1.75 is pushing it, but still removes it before things get catastrophic.
//NOTE: this is not yet addressed for higher-order images, which still do cause havoc.
//this is on purpose, they are separate meshes that could just be disabled as well.
// There is also a peculiar glitch with higher-order images when the mesh is exactly *in front* of the shadow, to be investigated.
const STAR_HIDE_FACTOR = 1.75;
function tidalRadiusInternal() {
  const Rint = star.radiusRsun * RSUN_KM / kmPerInternal();
  return Rint * Math.pow(bhMassSolar / Math.max(star.massMsun, 1e-6), 1/3);
}
// Minimum safe periapsis (internal): the larger of the tidal limit and a small
// margin outside the hitbox, so the star is always both intact and outside the
// strong-field capture region. Uses the frozen "birth" hitbox (R_HITBOX0) and the
// reference mass, so the lone star's orbit is never dragged outward as the hole
// grows — the star is a fixed showpiece, left alone per design.
function minSafePeriapsisInternal() {
  return Math.max(TIDAL_SAFETY * tidalRadiusInternal(), R_HITBOX0 * 1.05);
}
// Clamp (a,e) so a(1-e) >= min safe periapsis. Returns true if it had to clamp.
function clampStarOrbitSafe() {
  const aInt = star.aAU / auPerInternal();
  const periMinInt = minSafePeriapsisInternal();
  const periMinAU = periMinInt * auPerInternal();
  // enforce a(1-e) >= periMinAU. Prefer keeping e; if a is too small, push a up.
  let clamped = false;
  if (star.aAU * (1 - star.e) < periMinAU) {
    // first try reducing e to the max allowed for this a
    const eMax = 1 - periMinAU / star.aAU;
    if (eMax >= 0) { star.e = Math.min(star.e, eMax); clamped = true; }
    else { star.aAU = periMinAU / (1 - star.e); clamped = true; } // a too small even at e=0
  }
  return clamped;
}

// The star is rendered with its own ShaderMaterial that copies the k=0 particle
// lensing (deflectionAngle + solvePrimaryTheta + thin-lens geometry) but applies
// it per-vertex, so the sphere distorts as it passes behind the BH. Color is
// computed once from center-of-mass uniforms (position/velocity/temperature),
// no per-vertex temperature.
// =====================================================================
// SHARED GLSL CHUNKS
// The three vertex shaders (particle / star / starfield) ran three
// hand-maintained copies of the same lensing maths, now spliced in by 
// template interpolation below. Declaration order matters: obsLapse before the
// solver, solver before lensK0, critRadius before higherOrderDir.
// =====================================================================
const GL_CONST = `
  const float PI = 3.141592653589793;
  const float LOG_T_LUT_MAX = 3.4965076; // log(33)
`;
// =====================================================================
// GL_TEMPLUT
//
// The old branch linearly interpolated FOPT from 0.35 to 0.0017 in
// t = (logT - log33)/(log100 - log33). GLSL's mix() does NOT clamp t, so
// past t = 1 the alpha channel keeps falling, crosses zero at
// t = 0.35/0.3483 = 1.0049  ->  T = 100.5 kK,
// and max(...,0.0) pins it at EXACTLY 0 forever after. logLvis then takes
// log(max(fopt,1e-30)) = -69, i.e.
//     log10 L_vis:  +5.22 at 100 kK  ->  -21.7 at 120 kK
// a 27-decade cliff. shade() maps that to lin = 0, disp = 0, and since the
// final colour is (whiteout mix) * disp, the particle renders pure BLACK.
// It is still drawn — size does not depend on disp — it is just black.
// Note the whiteout logic was never the problem: whiteoutTemp already
// ramps to pure white across 100-400 kK exactly as intended. It was being
// multiplied by a zero.
//
// The physically correct continuation, verified against direct Planck
// integration over 380-750 nm:
//   * Colour freezes. For T >> hc/(lambda k) ~ 26 kK the visible band sits
//     in the Rayleigh-Jeans regime, B_lambda -> 2ckT/lambda^4: the spectral
//     SHAPE there is T-independent, so chromaticity converges to a fixed
//     blue-white. (The table's own two hottest entries already differ by
//     only ~4% per channel — that is the convergence showing.)
//   * FOPT falls as a power law: visible power ∝ T while total ∝ T^4, so
//     FOPT ∝ T^-3 asymptotically. A least-squares fit over 33-3000 kK gives
//     exponent 2.917; anchoring at the table top instead (which buys exact
//     continuity at the seam, worth more than asymptotic purity here) the
//     best exponent is ~2.85-2.89, max error 0.08-0.10 dex over two decades
//     of temperature. 2.89 used below.
//
// Consequence: log10 L_vis becomes 4*log10(T) - 2.89*log10(T) + const, i.e.
// L_vis ∝ T^1.11 — hot material gets slowly brighter, monotonically, and
// nothing can ever fall off a cliff again:
//     33 kK -> 4.69,  100 kK -> 5.22,  400 kK -> 5.89,  3000 kK -> 6.86.
//
// FOPT_TOP must equal the LUT's top-of-table alpha, FOPT_MATCHED[7] = 0.035.
// =====================================================================
const GL_TEMPLUT = `
  const float FOPT_TOP  = 0.035;   // FOPT at 33 kK == LUT top alpha (keep in sync)
  const float RJ_EXP    = 2.89;    // Rayleigh-Jeans tail: FOPT ~ T^-2.89
  const vec3  RJ_RGB    = vec3(0.298, 0.545, 0.973); // frozen RJ chromaticity

  vec4 tempLookup(float tempKK) {
    float logT = log(max(tempKK, 1e-4));
    if (logT < 0.0) { float s = smoothstep(-0.5, 0.0, logT); return vec4(0.251,0.0,0.0,1e-8)*s; }
    if (logT <= LOG_T_LUT_MAX) return texture2D(tempLUT, vec2(logT / LOG_T_LUT_MAX, 0.5));
    // Above the table: colour frozen at the Rayleigh-Jeans limit, visible-band
    // fraction decaying as a power law. Continuous with the LUT top in both
    // channels; unbounded in T, so no clamp and no zero is reachable.
    return vec4(RJ_RGB, FOPT_TOP * exp(-RJ_EXP * (logT - LOG_T_LUT_MAX)));
  }
`;

const GL_FOPT = `
  float brightFromFopt(float fopt) {
    return clamp((log(max(fopt,1e-12))*0.4342944819 + 10.36)/10.0, 0.0, 1.0);
  }
`;
const GL_OBS = `
  // r_s/r_cam for the observer. Sentinel 0 = camera is remote (r_cam > 15 r_s):
  // every term below then collapses to an exact 1.0 multiply, so the far-field
  // path is numerically unchanged and the branch is uniform-coherent.
  uniform float uRsOverRcam;

  // ---- observer-in-curved-space terms ------------------------------------
  // Lapse at the camera, sqrt(1 - r_s/r_cam). Everything a static observer
  // measures locally is referred to infinity through this one factor:
  //   angle -> impact parameter   b = r_cam sin(theta) / lapse   (exact)
  //   shadow half-angle           sin(psi) = b_crit*lapse / r_cam (Synge, exact)
  //   observed frequency          nu_obs = nu / lapse
  float obsLapse()    { return (uRsOverRcam > 0.0) ? sqrt(1.0 - uRsOverRcam) : 1.0; }
  float obsInvLapse() { return (uRsOverRcam > 0.0) ? inversesqrt(1.0 - uRsOverRcam) : 1.0; }
`;
const GL_DEFL = `
  float deflectionAngle(float b) {
    if (b <= uBcrit) return 1e9;
    return (2.0*uRs/uBcrit) * (-log(1.0 - uBcrit/b)) * uLensStrength;
  }
`;
const GL_SOLVER = `
  float solvePrimaryTheta(float beta, float rC, float K, float rSrc) {
    float lap = obsLapse(), inv = obsInvLapse();
    // thetaInf is the shadow half-angle: b = b_crit  <=>  sinθ = b_crit·lapse/r_cam.
    // The Synge correction therefore falls out of the same factor as the b map --
    // it is not a second, independently applied term.
    float thetaInf = asin(min(1.0, uBcrit*lap/rC));
    // Initial guess = the exact weak-field solution, not a scale estimate.
    // With alpha = 2 r_s L / b and b = r_C*theta (small angle), the lens equation
    // theta - K*alpha = beta becomes a quadratic,
    //     theta^2 - beta*theta - theta_E^2 = 0,   theta_E^2 = 2 r_s L K / r_C,
    // whose positive root is closed-form. It already satisfies theta >= beta and
    // theta >= theta_E, so it needs no max() against either. The remaining
    // Newton steps only have to pick up the log term (the strong-deflection
    // correction near the ring) rather than find the answer from scratch --
    // which is why 2 steps from here beat 3 from the old guess:
    //     r_C=20   old 3 steps 0.48%   ->   new 2 steps 0.00%
    //     r_C=8    old 3 steps 2.36%   ->   new 2 steps 0.00%
    float thetaE2 = 2.0*uRs*uLensStrength*K/max(rC, 1e-6);
    // Floor is thetaInf*1.05, NOT thetaInf: at theta == thetaInf exactly,
    // b == b_crit, where alpha diverges and dalpha/db -> -infinity, so gp blows
    // up and Newton's step collapses to zero, thus the solver freezes on the ring.
    // That bites infalling material specifically, because K = 1 - r_cam/distL is
    // tiny there, so the quadratic root lands below thetaInf and gets floored
    // onto the singular point. The 5% standoff keeps the derivative finite; it
    // costs nothing elsewhere (worst-case error identical to 2 decimals at every
    // r_cam from 8 to 140).
    float theta = max(0.5*(beta + sqrt(beta*beta + 4.0*thetaE2)), thetaInf*1.05);
    for (int it = 0; it < 2; it++) {   // 2 suffices from the closed-form start
      float b = rC*sin(theta)*inv;
      if (b <= uBcrit*1.0001) { theta = asin(min(1.0, uBcrit*1.0001*lap/rC)); b = rC*sin(theta)*inv; }
      float a = deflectionAngle(b);
      // Degenerate: no b > b_crit exists at this camera radius, so the primary
      // image is undefined (camera inside the critical impact parameter). The
      // 1e9 sentinel would otherwise blow theta up to ~1e9, where float32 ULP is
      // 64 -- identical for every source, so every one of them ends up drawn in
      // the SAME direction. Leave theta at thetaInf instead.
      if (a > 1.0e8) break;
      float g = theta - K*a - beta;
      float dadb = -(2.0*uRs*uLensStrength)/(b*(b - uBcrit));
      float gp = 1.0 - K*dadb*rC*cos(theta)*inv;   // db/dθ carries the same 1/lapse
      // gp -> 0 when theta crosses pi/2: cos flips sign there and the strong-
      // deflection term cancels the leading 1.0, so Newton's step is unbounded.
      // theta then runs away (5.55 rad measured at r_C=2). Because the image is
      // built as cos(th)*dBH + sin(th)*t, any theta outside [0,pi] wraps, so that a
      // runaway theta re-enters at an arbitrary angle, including at the shadow
      // centre, creating an artifact of "particles smeared across the shadow".
      // Bites only where the shadow is large (r_cam < ~3.5); above that the
      // limiter never engages and convergence is bit-identical.
      if (abs(gp) < 0.25) gp = (gp >= 0.0) ? 0.25 : -0.25;
      theta -= clamp(g/gp, -0.4, 0.4);
      // Upper clamp keeps b = rC*sin(theta) >= b_crit on both sides of pi/2 and
      // makes it impossible for any image to land inside the shadow.
      theta = clamp(theta, thetaInf*1.0001, max(thetaInf*1.0001, PI - thetaInf*1.0001));
    }

    // ---- physical ceiling for material inside the photon sphere -------------
    // The effective potential V(r) = (1 - r_s/r)/r^2 peaks at r = 1.5 r_s with
    // V_max = 1/b_crit^2. An OUTGOING photon launched from inside that radius
    // escapes only if 1/b^2 > V_max, i.e. b < b_crit. So a source inside the
    // photon sphere images strictly INSIDE the shadow -- it can never appear
    // outside the photon ring.
    //
    // The strong-deflection formula cannot know this: it assumes the ray has a
    // periapsis outside the photon sphere and comes back out, and left alone it
    // asymptotes to b = 1.085*b_crit as r_src -> r_s, i.e. ~9% on the WRONG side
    // of the ring. Infalling particles then hang outside the ring and redshift
    // out before reaching it.
    //
    // Sources far behind the hole need a large azimuthal sweep, which drives
    // b -> b_crit from below, so the correct limit is "just inside the ring".
    // Ramp onto it across [1.5 r_s, 2.5 r_s]: the spawn radius is untouched and
    // only material that has actually begun to plunge is affected.
    float wOut = smoothstep(1.5*uRs, 2.5*uRs, rSrc);
    theta = mix(min(theta, thetaInf*0.999), theta, wOut);
    return theta;
  }
`;
const GL_LENSK0 = `
  vec3 lensK0(vec3 S, vec3 camPos) {
    float rC = length(camPos);
    vec3 L = S - camPos; float distL = max(length(L), 1e-6);
    vec3 dS = L / distL;
    vec3 dBH = -camPos / rC;
    float tClosest = dot(dS, -camPos);
    float dotv = clamp(dot(dS, dBH), -1.0, 1.0);
    float beta = acos(dotv);
    if (tClosest > 0.0 && tClosest < distL) {
      vec3 t = dS - dotv*dBH; float tl = length(t);
      if (tl < 1e-6) { vec3 ref=(abs(dBH.x)<0.9)?vec3(1,0,0):vec3(0,1,0); t=cross(ref,dBH); tl=length(t); }
      t /= max(tl,1e-9);
      float K = clamp(1.0 - rC/distL, 0.0, 1.0);
      float th = solvePrimaryTheta(beta, rC, K, length(S));
      // taper the deflection smoothly to zero as beta -> pi/2 (where the thin-lens
      // approximation degrades and the tClosest gate takes over) so there is no
      // discontinuity at the old hard cone edge.
      float w = 1.0 - smoothstep(1.0, 1.55, beta);
      th = beta + w * (th - beta);
      vec3 dImg = cos(th)*dBH + sin(th)*t;
      // Kerr frame-dragging (Born), skipped at a=0. Δv_LT = −(4Ma/b²)[(Ŝ·b̂)ĵ+(Ŝ·ĵ)b̂],
      // b̂ = BH→closest approach, ĵ = d̂×b̂; image shifts by δθ = −K·Δv_LT. The leading
      // minus is the backward-ray-tracing correction (matches particle shader).
      if (uBhSpin > 0.0) {
        float stt = sin(th), ctt = cos(th);
        float bImp = rC * stt;
        if (bImp > 1e-3) {
          float GMs = 0.5*uRs;
          float aLen = uBhSpin * GMs;
          vec3 bHat = ctt*t - stt*dBH;
          vec3 jHat = cross(dImg, bHat);
          vec3 spinAx = vec3(0.0, 1.0, 0.0);
          float sb = dot(spinAx, bHat);
          float sj = dot(spinAx, jHat);
          float coef = -4.0*GMs*aLen/(bImp*bImp);
          vec3 dv = -coef*(sb*jHat + sj*bHat);
          dImg = normalize(dImg - K*dv);
        }
      }
      return camPos + dImg*distL;
    }
    return S;
  }
`;
const GL_CRIT = `
  float critRadius(float phi) {
    return texture2D(uCritLUT, vec2(phi / (2.0*PI), 0.5)).r;
  }
`;

// =====================================================================
// GL_HOD — finite-distance higher-order image solver 
//
// A photon sweeping azimuth Δφ around the BH from a source at radius r_src
// to the camera at r_C decomposes as
//
//     Δφ = π + α(b) − ξ_src(b) − ξ_cam(b),
//
// where ξ = asin(b·lapse/r) is the Synge angle between the ray and the
// radial direction at each endpoint (the straight-leg cutoffs) and α(b) is
// the asymptotic deflection. The sweep demanded by image order k is
//
//     odd  k (opposite side):  Δφ = (k+1)π − ψ
//     even k (same side):      Δφ = kπ + ψ
//
// so every order solves ONE implicit equation,
//
//     α(b) = A_k + ξ_src(b) + ξ_cam(b),      A_k = alphaForOrder(k, ψ).
//
// The old code dropped the ξ terms and inverted α(b) = A_k with the Bozza
// strong-deflection form b = rcrit·(1 + exp(b̄ − A)). That is valid only for
// A ≫ 1; at k = 1 with the source behind the hole, A = π − ψ → 0 and the
// image — the weak-field *secondary*, i.e. the underside of the far disk —
// was pinned near the ring instead of sliding out toward the Einstein
// radius. Keeping the ξ terms makes the same equation valid in every
// regime: for A large they are a small correction and b hugs the critical
// curve exactly as before; for A → 0 they reproduce the finite-distance
// secondary (agrees with the opposite-side thin-lens solution to <1% near
// alignment). k = 0 (solvePrimaryTheta) is untouched, and no thin-lens
// lever arm K appears here — which also means near-side sources (where
// K = 1 − r_C/distL ≤ 0 would have killed a thin-lens route) fall out of
// the same equation with A ≈ π, hugging the ring as before.
//
// α(b) is the same log interpolant as GL_DEFL, coefficient 2·r_s/rcrit
// (rcrit in place of b_crit so the Kerr critical curve carries through),
// making orders 0 and ≥1 mutually consistent where their domains meet.
// uLensStrength is deliberately NOT applied: it is documented as the
// order-0 multiplier, and scaling a winding deflection is not meaningful.
// Change C below to include it if you decide otherwise.
//
// Solved by Newton in α on  F(α) = α − A − ξ_src(b(α)) − ξ_cam(b(α)),
// using the analytic inverse b(α) = rcrit/(1 − exp(−α/C)). Since
// db/dα < 0 and dξ/db > 0, F' = 1 + (positive) ≥ 1 everywhere: F is
// strictly monotone, the root is unique, and Newton steps are bounded by
// the residual — no stationary points, no runaway, no per-branch clamps.
// 4 unrolled iterations reach float precision across k = 1..3,
// ψ ∈ [2°, 179°], r_src ∈ [3, 40], r_C ∈ [4, 10⁶] and rcrit ± 15% (Kerr
// span), verified against a 200-step bisection reference. uBbar survives
// only as the seed of the initial guess.
//
// Known soft spot: sources at r_src ≲ 2 r_s near perfect alignment hit the
// tangential-emission ceiling b ≤ r_src/lapse_src (a photon leaving radius
// r cannot carry more impact parameter than tangential emission gives it);
// the final clamp handles it. This is the same plunge corner the k = 0
// solver already ramps separately.
// =====================================================================
const GL_HOD = `
  float higherOrderDir(vec3 S, float kf, vec3 camPos, float rC, out vec3 dir) {
    dir = vec3(0.0);
    float sLen = length(S);
    if (sLen < 0.000001 || rC < 0.000001) return -1.0;
    float dotSC = clamp(dot(S, camPos) / (sLen * rC), -1.0, 1.0);
    float psi = acos(dotSC);
    float odd = mod(kf, 2.0);
    float A = (odd > 0.5) ? (kf*PI - psi) : ((kf - 1.0)*PI + psi);

    vec3 dBH = -camPos / rC;
    vec3 L = S - camPos;
    float Llen = max(length(L), 0.000001);
    vec3 dS = L / Llen;
    float proj = dot(dS, dBH);
    vec3 t = dS - proj*dBH;
    float tLen = length(t);
    if (tLen < 0.000001) {
      vec3 ref = (abs(dBH.x) < 0.9) ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
      t = cross(ref, dBH); tLen = length(t);
    }
    t /= tLen;
    float side = (odd > 0.5) ? -1.0 : 1.0;
    vec3 tHat = side * t;                     // image-plane direction of this image

    // ring radius: Kerr critical curve at this azimuth (b_crit if a=0)
    float rcrit = uBcrit;
    if (uBhSpin > 0.0) {
      vec3 spinAx = vec3(0.0, 1.0, 0.0);
      vec3 Sproj = spinAx - dot(spinAx, dBH)*dBH;
      float Sl = length(Sproj);
      if (Sl < 1e-5) {                        // pole-on: azimuth degenerate, curve ~circular
        vec3 ref = (abs(dBH.x) < 0.9) ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
        Sproj = normalize(cross(ref, dBH));
      } else Sproj /= Sl;
      vec3 hAxis = cross(dBH, Sproj);         // +α axis (retrograde side)
      float phi = atan(dot(tHat, Sproj), dot(tHat, hAxis)); // from +α toward +β
      rcrit = critRadius(phi);
    }

    // ---- finite-distance order equation, Newton in alpha --------------------
    float C = 2.0*uRs/rcrit;                  // log coefficient of GL_DEFL's law
    float lapC = obsLapse();
    float lapS = sqrt(max(0.0, 1.0 - uRs/sLen));
    // initial guess: the old Bozza b, plus the xi terms it implies
    float bG = rcrit*(1.0 + exp(uBbar - A));
    float al = max(A + asin(min(bG*lapS/sLen, 0.9999))
                     + asin(min(bG*lapC/rC,  0.9999)), 0.02);
    float b = bG;
    for (int i = 0; i < 4; i++) {
      b = rcrit / max(1.0 - exp(-al/C), 1e-6);
      float sS = min(b*lapS/sLen, 0.9999);
      float sC = min(b*lapC/rC,  0.9999);
      float F  = al - A - asin(sS) - asin(sC);
      float mdb = b*(b - rcrit)/(rcrit*C);    // -db/dalpha  (positive)
      float Fp = 1.0 + mdb*( lapS/(sLen*sqrt(1.0 - sS*sS))
                           + lapC/(rC  *sqrt(1.0 - sC*sC)) );
      al = max(al - F/Fp, 0.02);
    }
    b = rcrit / max(1.0 - exp(-al/C), 1e-6);
    // tangential-emission ceiling (see header): only plunging material near
    // perfect alignment ever reaches it.
    b = min(b, 0.9999*sLen/max(lapS, 1e-3));

    float ratio = b * lapC / rC;              // exact b -> local viewing angle
    if (ratio >= 1.0) return -1.0;
    float theta = asin(ratio);
    dir = cos(theta)*dBH + sin(theta)*tHat;
    return theta;
  }
`;

const starVertexShader = `
  uniform vec3  uCamPos;
  uniform vec3  uStarPos;    // center-of-mass world position
  uniform vec3  uStarVel;    // center-of-mass velocity (celerity q)
  uniform float uStarTemp;   // intrinsic surface temperature (K)
  uniform float uBcrit;
  uniform float uBbar;
  uniform float uRs;
  uniform float uLensStrength;
  uniform float uDopplerOn;
  uniform float uBetaCut;
  uniform float uBeamC;
  uniform float uStarLensOn;
  uniform float uHoBright;    // higher-order brightness falloff (shared with particles)
  uniform float uBhSpin;      // Kerr spin a* ∈ [0,1]; 0 = Schwarzschild (skips frame-dragging)
  uniform sampler2D uCritLUT; // Kerr critical curve r_crit(φ) LUT (shared with particles)
  uniform sampler2D tempLUT;
  attribute float aImageOrder; // per-mesh constant: image order (0 = direct, 1..k = relativistic)
  varying vec3 vColor;

${GL_CONST}

${GL_TEMPLUT}
${GL_FOPT}
${GL_OBS}

${GL_DEFL}
${GL_SOLVER}
  // per-vertex k=0 thin-lens: map a world source point to its lensed apparent position
${GL_LENSK0}
  // Kerr critical-curve radius at image-plane azimuth φ (shared LUT; RepeatWrapping seam).
${GL_CRIT}
  // per-vertex higher-order (relativistic) image direction — mirrors particleVertexShader
  // so the strong-deflection math lives in one form. The images pile onto the Kerr
  // critical curve: r_crit(φ) replaces b_crit (they coincide when a=0). Writes the
  // camera-to-image unit direction into dir; returns theta_k (or -1 if degenerate).
${GL_HOD}
  // COM-based observed color for a given image order. Even orders (0,2,4..) see the
  // approaching-side Doppler; odd orders (1,3..) see it inverted. Order 0 additionally
  // gets δ^C beaming; higher orders get the per-order brightness falloff instead.
  vec3 starColor(float order) {
    float r = length(uStarPos);
    float q2 = dot(uStarVel, uStarVel);
    float gammaP = sqrt(1.0 + q2);
    float betaMag = sqrt(q2) / gammaP;
    float g = sqrt(max(0.0, 1.0 - uRs/r) * max(0.0, 1.0 - q2/(1.0+q2)));
    // g is the EMITTER-side factor; obsInvLapse() is the observer-side piece,
    // so nu_obs/nu_emit = lapse(r_src)/lapse(r_cam). Matches effectiveTemps() in
    // the particle shader.
    float tBase = uStarTemp * g * obsInvLapse();
    float betaLOS = 0.0, dopA = 0.0;
    if (uDopplerOn > 0.5 && betaMag >= uBetaCut) {
      vec3 nHat = normalize(uCamPos - uStarPos);
      betaLOS = dot(uStarVel, nHat) / gammaP; dopA = 1.0;
    }
    bool even = (mod(order, 2.0) < 0.5);
    float tEff = even ? (tBase / max(1.0 - betaLOS, 0.05))
                      : (tBase / max(1.0 + betaLOS, 0.05));
    vec4 lut = tempLookup(tEff * 0.001);
    vec3 col = lut.rgb * brightFromFopt(lut.a);
    if (order < 0.5) {
      if (dopA > 0.5) { float dLong = 1.0/max(1.0-betaLOS,0.05); col *= pow(dLong/gammaP, uBeamC); }
    } else {
      col *= max(0.0, 1.0 - order*(1.0 - uHoBright));   // dim higher orders (no beaming)
    }
    return col;
  }

  void main() {
    float order = aImageOrder;
    vec3 world = (modelMatrix * vec4(position, 1.0)).xyz;   // vertex world position
    float rC = length(uCamPos);
    vec3 lensed;
    if (order < 0.5) {
      // direct image (k=0): primary thin-lens (or undistorted when lensing off)
      lensed = (uStarLensOn > 0.5) ? lensK0(world, uCamPos) : world;
    } else {
      // relativistic image (k>=1): per-vertex strong-deflection direction
      vec3 dir;
      float th = higherOrderDir(world, order, uCamPos, rC, dir);
      if (th < 0.0) {
        lensed = world;                        // degenerate (never happens for rC>>b_crit)
      } else {
        float dist = length(world - uCamPos);  // keep each vertex's own depth
        lensed = uCamPos + dir * dist;
      }
    }
    gl_Position = projectionMatrix * viewMatrix * vec4(lensed, 1.0);
    vColor = starColor(order);
  }
`;
const starFragmentShader = `
  varying vec3 vColor;
  void main() { gl_FragColor = vec4(vColor, 1.0); }
`;

let starLensOn = true;       // GPU per-vertex lensing on/off (for comparison)
const STAR_MAX_ORDER = 4;    // draw direct image (k=0) plus relativistic images k=1..4
let starMaterial = null;
function makeStarMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      tempLUT: { value: tempLUT },
      uCamPos: { value: new THREE.Vector3() },
      uStarPos: { value: new THREE.Vector3() },
      uStarVel: { value: new THREE.Vector3() },
      uStarTemp: { value: star.tempK },
      uBcrit: { value: B_CRIT },
      uBbar: { value: B_BAR },
      uRs: { value: RS },
      uLensStrength: { value: lensStrength },
      uDopplerOn: { value: dopplerEnabled ? 1 : 0 },
      uBetaCut: { value: betaDopplerCutoff },
      uBeamC: { value: beamingC },
      uStarLensOn: { value: 1 },
      uHoBright: { value: hoBrightness }, // shared with particles, could be tuned separately
      uBhSpin: { value: bhSpin },
      uCritLUT: { value: critLUTTex },
      uRsOverRcam: { value: 0.0 }   // 0 = remote-camera sentinel; see GL_OBS
    },
    vertexShader: starVertexShader,
    fragmentShader: starFragmentShader,
    side: THREE.DoubleSide  // lensing can flip winding; avoid holes when distorted
  });
}

// Build the star as a stack of meshes (one per image order) all sharing the same
// material (the lensing math lives in a single shader). Each mesh carries a
// constant per-geometry `aImageOrder` attribute selecting its order; k=0 is full
// resolution (it's the solid star), higher orders are low-poly (they collapse
// toward thin arcs on the ring). star.meshes[k] is order k; star.mesh aliases k=0.
function buildStar() {
  if (!starMaterial) starMaterial = makeStarMaterial();
  const Rint = star.radiusRsun * RSUN_KM / kmPerInternal();
  if (star.meshes) for (const m of star.meshes) { scene.remove(m); m.geometry.dispose(); }
  star.meshes = [];
  for (let k = 0; k <= STAR_MAX_ORDER; k++) {
    const seg = (k === 0) ? 12 : 6;
    const geo = new THREE.SphereGeometry(Rint, seg, seg);
    const nv = geo.attributes.position.count;
    const orderAttr = new Float32Array(nv);
    orderAttr.fill(k);
    geo.setAttribute('aImageOrder', new THREE.BufferAttribute(orderAttr, 1));
    const mesh = new THREE.Mesh(geo, starMaterial);
    mesh.frustumCulled = false;
    mesh.userData.order = k;
    scene.add(mesh);
    star.meshes.push(mesh);
  }
  star.mesh = star.meshes[0];
}

// Solve Kepler's equation M = E - e·sinE (Newton), return eccentric anomaly E.
function solveKepler(M, e) {
  M = ((M % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  let E = e < 0.8 ? M : Math.PI;
  //todo: let it exit early if the diff becomes small enough
  for (let k = 0; k < 8; k++) E = E - (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  return E;
}

// Advance and position the star from its mean anomaly, compute its orbital
// velocity (celerity), and push COM state to the material uniforms. dtInternal
// is the coordinate-time step this frame (same clock as the particle integrator).
const _starPos = new THREE.Vector3();
function updateStar(dtInternal) {
  if (!star.meshes) return;
  if (!star.visible) { for (const m of star.meshes) m.visible = false; return; }

  const aInt = star.aAU / auPerInternal();
  const n = Math.sqrt(GM / (aInt*aInt*aInt));  // mean motion (Newtonian, GM=0.5)
  star.meanAnomaly += n * dtInternal;

  // keep the star inside the camera far plane even when its orbit (which scales
  // as 1/M_BH in internal units) is large. Only touches the projection when the
  // required far actually changes (i.e. on mass / a / e changes), not every frame.
  const needFar = Math.max(2000, aInt * (1 + star.e) + controls.maxDistance + 100);
  if (Math.abs(camera.far - needFar) > 1) { camera.far = needFar; camera.updateProjectionMatrix(); }

  const E = solveKepler(star.meanAnomaly, star.e);
  const cE = Math.cos(E), sE = Math.sin(E);
  const ir = star.iDeg * Math.PI/180, si = Math.sin(ir), ci = Math.cos(ir);
  const sqe = Math.sqrt(1 - star.e*star.e);

  // perifocal position (P toward periapsis = +x; Q in-plane perpendicular).
  // Q is negated so the star orbits the SAME sense as the accretion disk.
  const P = aInt * (cE - star.e);
  const Q = -aInt * sqe * sE;
  _starPos.set(P, Q*si, Q*ci);
  for (const m of star.meshes) m.position.copy(_starPos); // all orders share the COM

  // orbital velocity (celerity q = γv), analytic from the Kepler state
  const dEdt = n / (1 - star.e*cE);
  const vP = -aInt * sE * dEdt;
  const vQ = -aInt * sqe * cE * dEdt;  // negated to match Q
  const vx = vP, vy = vQ*si, vz = vQ*ci;
  const v2 = Math.min(vx*vx + vy*vy + vz*vz, 0.998);
  const gam = 1 / Math.sqrt(1 - v2);

  const u = starMaterial.uniforms;
  u.uRs.value = RS;         // live horizon scale (hole grows as it accretes)
  u.uBcrit.value = B_CRIT;
  u.uCamPos.value.copy(camera.position);
  u.uStarPos.value.copy(_starPos);
  u.uStarVel.value.set(vx*gam, vy*gam, vz*gam);
  u.uStarTemp.value = star.tempK;
  u.uLensStrength.value = lensStrength;
  u.uDopplerOn.value = dopplerEnabled ? 1 : 0;
  u.uBetaCut.value = betaDopplerCutoff;
  u.uBeamC.value = beamingC;
  u.uStarLensOn.value = starLensOn ? 1 : 0;
  u.uHoBright.value = hoBrightness;
  u.uBhSpin.value = bhSpin;   // uCritLUT is the shared texture rebuilt by the particle pass
  u.uRsOverRcam.value = obsRsOverRcam;   // shared observer gate, computed in animate()

  // artifact guard for the direct image (k=0): hide it when it is (nearly) exactly
  // behind the BH and lensing is on — the per-vertex primary would otherwise wrap
  // into a ring and paint across the shadow. Only when behind the BH (a star in
  // front correctly occludes the shadow). 
  //todo: shadow-fill guard  for higher order images (could be attached here, or could become something more sophisticated giving them actual slice-shapes)
  let wrapHide = false;
  if (starLensOn) {
    const cp = camera.position, rC = cp.length();
    const tsx = _starPos.x - cp.x, tsy = _starPos.y - cp.y, tsz = _starPos.z - cp.z;
    const distStar = Math.hypot(tsx, tsy, tsz) || 1e-6;
    const cosB = (tsx*(-cp.x) + tsy*(-cp.y) + tsz*(-cp.z)) / (distStar * rC);
    const betaStar = Math.acos(Math.min(1, Math.max(-1, cosB)));
    const thetaStar = (star.radiusRsun * RSUN_KM / kmPerInternal()) / distStar;
    const behind = (distStar * cosB > rC);
    wrapHide = behind && (betaStar < STAR_HIDE_FACTOR * thetaStar);
  }
  star.meshes[0].visible = !wrapHide;
  for (let k = 1; k < star.meshes.length; k++) star.meshes[k].visible = starLensOn;
}

//The main course: all lensing math now lives in particleVertexShader (excepting per-frame precalculation of uCritLUT)
const particleVertexShader = `
  attribute float aInstanceOrder; // INSTANCED: 0 (direct) / 1 / 2 (higher orders)
  attribute vec3 aVel;            // physical velocity (celerity q) — for Doppler
  varying vec3 vColor;
  uniform float uAttenScale;
  uniform vec3  uCamPos;
  uniform float uBcrit;
  uniform float uBbar;
  uniform float uRs;
  uniform float uHoBright;
  uniform float uPBaseSize;
  uniform float uHoPixelSize;
  uniform float uHoRefDist;
  uniform float uBhSpin;       // Kerr spin a* ∈ [0,1]; 0 = Schwarzschild (skips frame-dragging)
  uniform sampler2D uCritLUT;  // Kerr critical curve r_crit(φ) LUT (1×N, .r = radius); flat b_crit at a=0
  uniform float uTemp0K;       // temperature scale (K at r = r_s)
  uniform float uLensStrength; // order-0 deflection multiplier
  uniform float uDopplerOn;
  uniform float uBetaCut;
  uniform float uBeamC;        // δ^C beaming exponent
  uniform float uShowLensHi;   // debug: paint lensed order-0 gold
  uniform float uShowInsideHi; // debug: paint inside-hitbox order-0 violet
  uniform float uRHitbox;
  uniform float uBrightLo;     // log10 L_vis mapped to black
  uniform float uBrightHi;     // log10 L_vis mapped to full scale
  uniform float uWhiteout;     // display level at which colour starts washing to white
  uniform float uBrightGamma;  // <1 flattens brightness differences, >1 steepens
  uniform float uFalseAmt;     // cold-particle false-colour strength
  uniform float uFalseDark;    // finished r+g+b below which a particle counts as "dark"
  uniform float uFalseColdK;   // local REST temperature below which it counts as "cold"
  uniform vec3  uFalseColor;   // the baseline false colour
  uniform float uSizeGain;     // 0 = fixed sprite size, >0 = size grows with brightness
  uniform sampler2D tempLUT;

${GL_CONST}
  const vec3  COL_LENSED = vec3(1.0, 0.812, 0.420);
  const vec3  COL_INSIDE = vec3(0.616, 0.486, 1.0);

${GL_TEMPLUT}
  // ---- physical brightness -> rgb ----------------------------------------
  // The relativistic side ends at an EFFECTIVE TEMPERATURE. Everything below is
  // ordinary Planck bookkeeping and pure display policy.
  //
  // Visible-band luminosity of a blackbody patch, log10, up to an additive
  // constant:   log10(σT⁴ · FOPT(T)) = 4·log10(T) + log10(FOPT(T)).
  // The LUT's .a channel IS FOPT(T), so this costs one log over what we had.
  //
  // Because T_obs already carries the FULL shift δ (SR Doppler, transverse,
  // emitter lapse, observer lapse), the T⁴ term reproduces the bolometric δ⁴
  // boost exactly -- identical to the star pipeline's explicit
  // D⁴·FOPT(TD)/FOPT(T), since (TD)⁴FOPT(TD) / T⁴FOPT(T) == D⁴·FOPT(TD)/FOPT(T).
  // Applying a separate beaming factor on top would therefore DOUBLE COUNT.
  float logLvis(float tempKK, float fopt) {
    return (4.0*log(max(tempKK, 1e-4)) + log(max(fopt, 1e-30))) * 0.4342944819;
  }
  // Display policy: map a window of log luminosity onto [0,1], then wash to
  // white at the top. Nothing here is physics -- it is the choice of which
  // physical range gets the available sub-white rgb. No false-colour logic
  // lives here any more; that is a single final-stage test at the bottom of
  // main(), applied to the finished colour.
  vec3 shade(vec4 lut, float tempKK, float lv, out float disp) {
    float lin = clamp((lv - uBrightLo) / max(uBrightHi - uBrightLo, 0.001), 0.0, 1.0);
    // Contrast curve. gamma < 1 lifts faint detail and flattens the differences
    // between bright and dim material; gamma > 1 steepens them.
    disp = (uBrightGamma == 1.0) ? lin : pow(lin, uBrightGamma);
    float whiteoutBright = smoothstep(uWhiteout, 1.0, disp);
    float whiteoutTemp   = smoothstep(100.0, 400.0, tempKK); // beyond LUT extrapolation
    return mix(lut.rgb, vec3(1.0), max(whiteoutTemp, whiteoutBright)) * disp;
  }

${GL_OBS}

  // deflection α(b): weak-limit 2 r_s/b, log divergence at b_crit
${GL_DEFL}
  // thin-lens primary image θ, 3 unrolled Newton steps (matches JS solvePrimaryTheta)
${GL_SOLVER}

  // Kerr critical-curve radius at image-plane azimuth φ (RepeatWrapping handles seam).
${GL_CRIT}

  // strong-deflection image direction for higher order k. The ring the images
  // pile onto is the Kerr critical curve: we look up r_crit(φ) at the image's
  // azimuth and use it in place of b_crit (they coincide when a=0).
${GL_HOD}

  // effective observed temps (even/odd) from physical state — mirrors JS.
  // Also returns gamma, betaLOS and a dopActive flag so callers can apply beaming.
  void effectiveTemps(vec3 S, vec3 vel, float r, vec3 camPos,
                      out float tEven, out float tOdd,
                      out float gammaP, out float betaLOS, out float dopActive) {
    float q2 = dot(vel, vel);
    gammaP = sqrt(1.0 + q2);
    float betaMag = sqrt(q2) / gammaP;
    float g = sqrt(max(0.0, 1.0 - uRs/r) * max(0.0, 1.0 - q2/(1.0+q2)));
    // g is the EMITTER-side factor (grav + transverse). obsInvLapse() is the
    // observer-side piece that was missing: ν_obs/ν_emit = lapse(r_src)/lapse(r_cam).
    float tBase = uTemp0K * pow(max(r, 0.001), -0.75) * g * obsInvLapse();
    betaLOS = 0.0; dopActive = 0.0;
    if (uDopplerOn > 0.5 && betaMag >= uBetaCut) {
      vec3 nHat = normalize(camPos - S);
      betaLOS = dot(vel, nHat) / gammaP;
      dopActive = 1.0;
    }
    tEven = tBase / max(1.0 - betaLOS, 0.05);
    tOdd  = tBase / max(1.0 + betaLOS, 0.05);
  }

  void main() {
    float order = aInstanceOrder;
    float rC = length(uCamPos);
    vec3 S = position;              // physical position (== pos array)
    float r = length(S);
    vec3 wpos; vec3 col; float sz; float atten;

    // NOTE: the observer-side gravitational intensity boost that used to live
    // here (gBeam = obsInvLapse()^C) has been REMOVED. It is now carried
    // exactly by T_obs⁴ inside logLvis(), since obsInvLapse() is already
    // folded into the effective temperature. Keeping it would double count.

    if (order < 0.5) {
      // ================= ORDER 0 (direct image) =================
      // --- thin-lens position ---
        vec3 outPos = S; bool lensed = false; 
        vec3 L = S - uCamPos; float distL = max(length(L), 1e-6);
        vec3 dS = L / distL;
        vec3 dBH = -uCamPos / rC;
        float tClosest = dot(dS, -uCamPos);
        float dotv = clamp(dot(dS, dBH), -1.0, 1.0);
        float beta = acos(dotv);
        if (tClosest > 0.0 && tClosest < distL) {
          vec3 t = dS - dotv*dBH; float tl = length(t);
          // t is a difference of near-equal unit vectors; below ~1e-6 its
          // DIRECTION is rounding noise, so the divide is floored.
          t /= max(tl, 1e-9);
          float K = clamp(1.0 - rC/distL, 0.0, 1.0);
          float th = solvePrimaryTheta(beta, rC, K, r);
          float w = 1.0 - smoothstep(1.0, 1.55, beta);  // fade deflection to 0 by beta~pi/2
          th = beta + w * (th - beta);
          vec3 dImg = cos(th)*dBH + sin(th)*t;
          // Kerr frame-dragging (Born), skipped at a=0. Δv_LT = −(4Ma/b²)[(Ŝ·b̂)ĵ+(Ŝ·ĵ)b̂],
          // b̂ = BH→closest approach, ĵ = d̂×b̂; image shifts by δθ = −K·Δv_LT. Mirrors JS.
          if (uBhSpin > 0.0) {

            float bImp = rC * stt;
            if (bImp > 1e-3) {
              float GMs = 0.5*uRs;               // GM = r_s/2
              float aLen = uBhSpin * GMs;
              vec3 bHat = ctt*t - stt*dBH;        // BH → closest approach (unit)
              vec3 jHat = cross(dImg, bHat);      // d̂ × b̂
              vec3 spinAx = vec3(0.0, 1.0, 0.0);  // diskNormal
              float sb = dot(spinAx, bHat);
              float sj = dot(spinAx, jHat);
              float coef = -4.0*GMs*aLen/(bImp*bImp);   // sign: backward ray-tracing flips frame-dragging
              vec3 dv = -coef*(sb*jHat + sj*bHat);
              dImg = normalize(dImg - K*dv);      // δθ = −K·Δv_LT
            }
          }
          outPos = uCamPos + dImg*distL; lensed = true;
        }
        wpos = outPos;
        // --- color from even effective temp, with δ^C beaming ---
        float tEven, tOdd, gammaP, betaLOS, dopActive;
        effectiveTemps(S, aVel, r, uCamPos, tEven, tOdd, gammaP, betaLOS, dopActive);
        float tKK = tEven * 0.001;
        vec4 lut = tempLookup(tKK);
        float lv = logLvis(tKK, lut.a);
        // δ⁴ is already inside lv via T_obs⁴. uBeamC is the TOTAL exponent the
        // user wants applied, so only the EXCESS over physical is added here:
        // C = 4 is exact, C < 4 under-beams, C > 4 exaggerates. No double count.
        if (dopActive > 0.5) {
          float dSR = max((1.0 / max(1.0 - betaLOS, 0.05)) / gammaP, 1e-6);
          lv += (uBeamC - 4.0) * log(dSR) * 0.4342944819;
        }
        float disp0;
        col = shade(lut, tKK, lv, disp0);
        // debug highlight overrides
        if (uShowLensHi > 0.5 && lensed) col = COL_LENSED;
        else if (uShowInsideHi > 0.5 && r < uRHitbox) col = COL_INSIDE;
      sz = uPBaseSize * (1.0 + uSizeGain * disp0); atten = 1.0;
    } else {
      // ================= HIGHER ORDERS =================
      vec3 dir;
      float th = higherOrderDir(S, order, uCamPos, rC, dir);
      // Per-order dimming, ADDITIVE IN LOG10 as the design note intends: order k
      // is offset by k*log10(uHoBright), i.e. scaled by uHoBright^k. The previous
      // form max(0, 1 - k*(1-h)) is only the first-order expansion of that, and it
      // goes NEGATIVE once h < 1 - 1/k -- at k=2 that is h < 0.5, where the clamp
      // tripped the bailout below and the second-order image was DISCARDED rather
      // than dimmed. h^k cannot reach zero for h > 0, so k=2 now fades smoothly.
      // Applied to log luminosity, not to the display value, so a dimmed image
      // slides down the same transfer curve as any other brightness change.
      float hoLogDim = order * log(max(uHoBright, 1e-8)) * 0.4342944819;
      if (th < 0.0 || uHoBright <= 0.0) {
        wpos = uCamPos; col = vec3(0.0); sz = 0.0; atten = 0.0;
      } else {
        float dist = length(S - uCamPos);
        wpos = uCamPos + dir * dist;
        float tEven, tOdd, gp, bl, act;
        effectiveTemps(S, aVel, r, uCamPos, tEven, tOdd, gp, bl, act);
        float tempK = (mod(order,2.0) < 0.5) ? tEven : tOdd;
        float tKK = tempK * 0.001;
        vec4 lut = tempLookup(tKK);
        float lv = logLvis(tKK, lut.a);
        if (act > 0.5) {
          float sSign = (mod(order,2.0) < 0.5) ? 1.0 : -1.0;
          float dSR = max((1.0 / max(1.0 - sSign*bl, 0.05)) / gp, 1e-6);
          lv += (uBeamC - 4.0) * log(dSR) * 0.4342944819;
        }
        lv += hoLogDim;
        float dispK;
        col = shade(lut, tKK, lv, dispK);
        // shrink HO images with camera distance: all HO images sit on the photon
        // ring (screen radius ∝ 1/r_C), so a fixed px size packs ever more of them
        // onto the shrinking ring and whites out. Scale ∝ 1/r_C beyond the ref dist.
        sz = uHoPixelSize * (1.0 + uSizeGain * dispK) * min(1.0, uHoRefDist / rC); atten = 0.0;
      }
    }

    // ---- false colour for cold, dark material -------------------------------
    // Deliberately the LAST thing before the colour leaves the vertex shader, so
    // it is independent of every Planck and display parameter above: it only
    // inspects the finished product.
    //   dark: finished r+g+b below uFalseDark
    //   cold: LOCAL REST temperature below uFalseColdK
    //
    // The temperature test uses the rest temperature uTemp0K*r^-0.75, NOT the
    // observed tBase. tBase already carries the gravitational redshift factor g,
    // so material inspiralling near the horizon has a LOW tBase while being
    // intrinsically hot -- testing on tBase would false-colour exactly the
    // particles we want to exclude. Rest temperature rises monotonically inward,
    // so this test excludes them on its own and no radius gate is needed.
    // (At uTemp0K = 1e4 K the 3000 K threshold sits at r = 4.98 r_s.)
    //
    // smoothstep rather than a hard cut: a step would band visibly where
    // neighbouring particles straddle the threshold. Collapse the ranges to zero
    // width to recover the plain test.
    if (uFalseAmt > 0.0) {
      float tRest = uTemp0K * pow(max(r, 0.001), -0.75);
      float dark = 1.0 - smoothstep(uFalseDark*0.75, uFalseDark*1.25, col.r + col.g + col.b);
      float cold = 1.0 - smoothstep(uFalseColdK*0.9, uFalseColdK*1.1, tRest);
      // per-order dimming, so a cold particle's k=1/k=2 images are not lifted to
      // the same level as its direct image
      col += uFalseColor * (dark * cold * uFalseAmt * pow(max(uHoBright, 0.0), order));
    }

    vColor = col;
    vec4 mv = modelViewMatrix * vec4(wpos, 1.0);
    gl_Position = projectionMatrix * mv;
    float attenuated = sz * uAttenScale / max(-mv.z, 0.001);
    gl_PointSize = mix(sz, attenuated, atten);
  }
`;

// =====================================================================
// REMOTE STARFIELD: thousands of point sources on the celestial sphere,
// lensed by the SAME Kerr-capable functions as the disk (copied verbatim
// below) so their images shear, shift and pile onto the photon ring exactly
// like disk material. They live at infinity, so we hand the lensing an
// effective source  S = camera + R_SKY·ŝ : the camera offset sits INSIDE S,
// so the ray direction is exactly ŝ (no parallax) while the lens lever arm
// K = 1 − r_C/R_SKY → 1 (the correct infinity limit). We keep only the lensed
// direction and stamp it on the far plane (skybox depth), so there is no real
// distance and nothing to clip. Colour from T (shared tempLUT); size and
// intensity from apparent magnitude.
// =====================================================================
// Mass at/above which the BH is "supermassive" enough that the starfield is its
// OWN galaxy rather than an unrelated backdrop: the galactic plane locks to the
// disk, and the band tightens from "no extra bias" here to a thin bright lane
// at GAL_MAX_MASS.
const GAL_ALIGN_MASS  = 1e5;
const GAL_MAX_MASS    = 1e10;
const GAL_SIGMA_WIDE  = 0.35;   // rad, ~20°  — band width at GAL_ALIGN_MASS
const GAL_SIGMA_TIGHT = 0.05;   // rad, ~2.9° — band width at GAL_MAX_MASS
const GAL_MAG_EXP     = 1.0;    // >1 pushes more of the magnitude range toward "bright, unbiased"

function generateStarfield(N = 10000, massSolar = null) {
  const HALF_PI = Math.PI / 2;
  const gauss = () => {
    const u = Math.random() || 1e-12;
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
  };
  const randomQuaternion = () => {
    const a = gauss(), b = gauss(), c = gauss(), d = gauss();
    const n = Math.sqrt(a*a + b*b + c*c + d*d);
    return [a/n, b/n, c/n, d/n];
  };
  const quaternionToPoint = ([w, x, y, z]) => [
    2 * (x*z + w*y),
    2 * (y*z - w*x),
    1 - 2 * (x*x + y*y),
  ];
  const pointToRaDec = (v) => {
    let ra = Math.atan2(v[1], v[0]);
    if (ra < 0) ra += 2 * Math.PI;
    const dec = Math.asin(Math.max(-1, Math.min(1, v[2])));
    return [ra, dec];
  };

  // Inverse standard normal CDF (Acklam), max relative error ~1.15e-9.
  // The declination warp wants sigma*sqrt(2)*erfinv(z); since z is uniform on
  // [-1,1] that is identically sigma*probit((z+1)/2), and probit is the easier
  // primitive to write accurately.
  const probit = (p) => {
    p = Math.min(1 - 1e-12, Math.max(1e-12, p));
    const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
                1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
                6.680131188771972e+01, -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
               -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
               3.754408661907416e+00];
    const pl = 0.02425, ph = 1 - pl;
    let q, r;
    if (p < pl) {
      q = Math.sqrt(-2 * Math.log(p));
      return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    if (p > ph) {
      q = Math.sqrt(-2 * Math.log(1 - p));
      return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
              ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
    q = p - 0.5; r = q*q;
    return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
           (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  };

  const mMin = -1.5, mMax = 6.5, ln3 = Math.log(3);
  const pMin = Math.pow(3, mMin), pMax = Math.pow(3, mMax);
  const sampleMagnitude = () =>
    Math.log(pMin + Math.random() * (pMax - pMin)) / ln3;
  const sampleTemperature = () =>
    Math.random() < 0.6
      ? 2000  + Math.random() * 8000
      : 10000 + Math.random() * 20000;

  // ---- band strength from BH mass -----------------------------------------
  // t = 0 below GAL_ALIGN_MASS and at it (no bias at all), 1 at GAL_MAX_MASS.
  const t = (massSolar !== null && massSolar >= GAL_ALIGN_MASS)
    ? Math.min(1, Math.max(0, Math.log10(massSolar / GAL_ALIGN_MASS) /
                              Math.log10(GAL_MAX_MASS / GAL_ALIGN_MASS)))
    : 0;
  const bandSigma = GAL_SIGMA_WIDE * Math.pow(GAL_SIGMA_TIGHT / GAL_SIGMA_WIDE, t);

  // Dim stars are assumed remote, so they trace the galactic disk; bright stars
  // are assumed nearby and stay roughly isotropic. 0 at the brightest magnitude,
  // 1 at the faintest.
  const biasWeight = (mag) =>
    Math.pow(Math.min(1, Math.max(0, (mag - mMin) / (mMax - mMin))), GAL_MAG_EXP);

  // ---- galactic frame ------------------------------------------------------
  // generateStarfield's internal +z becomes world +y in buildStarfield
  // (dirs[i*3+1] = sin(dec)), and +y is the spin axis / disk normal. So the
  // galactic plane coincides with the BH disk exactly when the pole is internal
  // +z -- the identity frame. Only the unaligned (low-mass) case needs a
  // rotation, and there the pole is uniformly random on the sphere.
  const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
  const norm = (v) => { const n = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) || 1;
                        return [v[0]/n, v[1]/n, v[2]/n]; };
  const pole = (t > 0) ? [0, 0, 1] : quaternionToPoint(randomQuaternion());
  const ref  = (Math.abs(pole[0]) < 0.9) ? [1, 0, 0] : [0, 1, 0];
  const e1   = norm(cross(ref, pole));
  const e2   = cross(pole, e1);
  const toWorld = (v) => [
    v[0]*e1[0] + v[1]*e2[0] + v[2]*pole[0],
    v[0]*e1[1] + v[1]*e2[1] + v[2]*pole[1],
    v[0]*e1[2] + v[1]*e2[2] + v[2]*pole[2],
  ];

  // ---- position: uniform sample, then warp the declination -----------------
  // No rejection. z is uniform on [-1,1] for a uniform sphere point, so
  // sigma*probit((z+1)/2) is EXACTLY Gaussian(0, sigma) in declination. Blending
  // against the unwarped asin(z) keeps bright stars isotropic: a = 0 reproduces
  // the uniform sphere exactly, a = 1 is the pure Gaussian band. Both branches
  // are monotonic in z, so the blend is monotonic and cannot fold.
  const biasedPoint = (mag) => {
    const v = quaternionToPoint(randomQuaternion());
    const z = Math.max(-1, Math.min(1, v[2]));
    let dec = Math.asin(z);
    const a = t * biasWeight(mag);
    if (a > 0) {
      const g = Math.max(-HALF_PI, Math.min(HALF_PI, bandSigma * probit(0.5 * (z + 1))));
      dec = (1 - a) * dec + a * g;
    }
    const az = Math.atan2(v[1], v[0]);     // azimuth is untouched
    const cd = Math.cos(dec);
    return [cd * Math.cos(az), cd * Math.sin(az), Math.sin(dec)];
  };

  const perturbPoint = (v, sigma) => {
    const x = v[0] + gauss() * sigma;
    const y = v[1] + gauss() * sigma;
    const z = v[2] + gauss() * sigma;
    const n = Math.sqrt(x*x + y*y + z*z);
    return [x/n, y/n, z/n];
  };
  const clusterTempThreshold = 15000;
  const clusterProb          = 0.08;
  const clusterAngularSigma  = 0.012;
  // Clusters still favour the plane. Evaluated on the GALACTIC-frame latitude
  // with a fixed width, so an unbiased sky keeps exactly the old behaviour.
  const clusterBandSigma = 0.30;
  const clusterBoost = (vGal) => {
    const b = Math.asin(Math.max(-1, Math.min(1, vGal[2])));
    return 0.3 + 0.7 * Math.exp(-(b*b) / (2 * clusterBandSigma * clusterBandSigma));
  };

  const stars = [];
  while (stars.length < N) {
    // magnitude first: the positional bias depends on it
    const mag = sampleMagnitude();
    const T   = sampleTemperature();
    const vGal = biasedPoint(mag);
    const [ra, dec] = pointToRaDec(toWorld(vGal));
    stars.push([ra, dec, mag, T]);
    if (T > clusterTempThreshold &&
        Math.random() < clusterProb * clusterBoost(vGal) &&
        stars.length < N) {
      const nCompanions = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < nCompanions && stars.length < N; i++) {
        // companions perturb the parent's ALREADY-WARPED position, so a cluster
        // stays a cluster instead of being scattered by its members' magnitudes
        const vp = perturbPoint(vGal, clusterAngularSigma);
        const [ra2, dec2] = pointToRaDec(toWorld(vp));
        const T2   = 10000 + Math.random() * 20000;
        const mag2 = Math.max(mMin, Math.min(mMax, mag + gauss() * 1.2));
        stars.push([ra2, dec2, mag2, T2]);
      }
    }
  }
  return stars.slice(0, N);
}

let nStars = 8000;               // current star count (UI slider); regen on increase, truncate on decrease
let starGeneratedCount = 0;      // how many stars actually live in the buffers
const MAX_STAR_ORDER = 2;        // match the disk's higher-order images (0,1,2)
const STAR_MAG_REF = 4.0;        // apparent magnitude mapped to unit flux
let starPixel = 1.5;             // base sprite size (px) at unit flux (UI slider)
let starBrightness = 2.5;        // global intensity multiplier (UI slider)
let starfieldEnabled = true;
let starfield = null;

// Lensing helpers below are copied verbatim from the star-mesh shader so the
// starfield's images are identical to the disk's. main() differs: it forms the
// far source S, keeps only the lensed direction, and renders on the far plane.
const starfieldVertexShader = `
  uniform vec3  uCamPos;
  uniform float uBcrit;
  uniform float uBbar;
  uniform float uRs;
  uniform float uLensStrength;
  uniform float uHoBright;
  uniform float uBhSpin;
  uniform sampler2D uCritLUT;
  uniform sampler2D tempLUT;
  uniform float uStarPixel;
  uniform float uStarBright;
  uniform float uMagRef;
  uniform float uHoRefDist;

  attribute vec3  aStarDir;      // unit direction to the star (celestial sphere)
  attribute float aStarMag;      // apparent magnitude
  attribute float aStarTemp;     // temperature (K)
  attribute float aInstanceOrder;// image order (0 = direct, 1.. = relativistic)

  varying vec3 vColor;

${GL_CONST}
  const float R_SKY = 1.0e5;     // effective source distance → K≈1, ŝ-exact ray, no parallax

${GL_TEMPLUT}
${GL_FOPT}
${GL_OBS}

${GL_DEFL}
${GL_SOLVER}
${GL_LENSK0}
${GL_CRIT}
${GL_HOD}

  void main() {
    float order = aInstanceOrder;
    float rC = length(uCamPos);
    vec3 S = uCamPos + R_SKY * aStarDir;   // effective far source along ŝ
    vec3 lensedDir; bool visible = true;
    if (order < 0.5) {
      vec3 pos = lensK0(S, uCamPos);
      lensedDir = normalize(pos - uCamPos);
    } else {
      vec3 dir;
      float th = higherOrderDir(S, order, uCamPos, rC, dir);
      if (th < 0.0) { visible = false; lensedDir = aStarDir; } else lensedDir = dir;
    }
    // stamp on the far plane in the lensed direction (skybox depth trick):
    // a point one unit away in dir projects to the right screen spot; z=w puts
    // it at the far plane (LessEqualDepth lets it pass; opaque geometry occludes).
    vec4 clip = projectionMatrix * viewMatrix * vec4(uCamPos + lensedDir, 1.0);
    gl_Position = clip.xyww;

    // stars sit at infinity, so the only frequency shift is the observer's own
    // gravitational blueshift
    vec4 lut = tempLookup(aStarTemp * 0.001 * obsInvLapse());
    float flux = pow(10.0, -0.4 * (aStarMag - uMagRef));      // relative flux
    float orderScale = (order < 0.5) ? 1.0 : max(0.0, 1.0 - order*(1.0 - uHoBright));
    vColor = lut.rgb * uStarBright * sqrt(flux) * orderScale; // √-compressed intensity
    if (!visible) vColor = vec3(0.0);

    float sizeBoost = 1.0 + 0.6 * log2(1.0 + flux);           // brighter → a little larger
    // order 0 = a star at infinity: constant angular (pixel) size, no distance scaling.
    // higher orders sit on the photon ring, so they shrink ∝ 1/r_C like the disk's.
    float hoScale = (order < 0.5) ? 1.0 : 0.75 * min(1.0, uHoRefDist / rC);
    gl_PointSize = uStarPixel * sizeBoost * hoScale;
    if (!visible) gl_PointSize = 0.0;
  }
`;
const starfieldFragmentShader = `
  varying vec3 vColor;
  void main() {
    vec2 d = gl_PointCoord - vec2(0.5);
    float r2 = dot(d, d) * 4.0;                  // ~1 at the sprite edge
    float a = exp(-r2*8.0) + 0.5*exp(-r2*3.0);   // bright core + wide soft skirt
    gl_FragColor = vec4(vColor * a, 1.0);
  }
`;

function buildStarfield(count) {
  count = count || nStars;
  const raw = generateStarfield(count, bhMassSolar);
  const n = raw.length;
  starGeneratedCount = n;
  const dirs  = new Float32Array(n*3);
  const mags  = new Float32Array(n);
  const temps = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = raw[i], ra = s[0], dec = s[1], cd = Math.cos(dec);
    dirs[i*3]   = cd*Math.cos(ra);
    dirs[i*3+1] = Math.sin(dec);          // dec → spin axis (y); galactic band tilts across sky
    dirs[i*3+2] = cd*Math.sin(ra);
    mags[i]  = s[2];
    temps[i] = s[3];
  }
  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position',  new THREE.BufferAttribute(dirs, 3));   // vertex count only (shader ignores it)
  geo.setAttribute('aStarDir',  new THREE.BufferAttribute(dirs, 3));
  geo.setAttribute('aStarMag',  new THREE.BufferAttribute(mags, 1));
  geo.setAttribute('aStarTemp', new THREE.BufferAttribute(temps, 1));
  const orders = new Float32Array(MAX_STAR_ORDER + 1);
  for (let k = 0; k <= MAX_STAR_ORDER; k++) orders[k] = k;
  geo.setAttribute('aInstanceOrder', new THREE.InstancedBufferAttribute(orders, 1));
  geo.instanceCount = MAX_STAR_ORDER + 1;
  geo.setDrawRange(0, Math.min(nStars, n));   // truncation happens here

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tempLUT: { value: tempLUT },
      uCritLUT: { value: critLUTTex },
      uCamPos: { value: new THREE.Vector3() },
      uBcrit: { value: B_CRIT },
      uBbar: { value: B_BAR },
      uRs: { value: RS },
      uLensStrength: { value: lensStrength },
      uHoBright: { value: hoBrightness },
      uBhSpin: { value: bhSpin },
      uStarPixel: { value: starPixel },
      uStarBright: { value: starBrightness },
      uMagRef: { value: STAR_MAG_REF },
      uHoRefDist: { value: HO_REF_DIST },
      uRsOverRcam: { value: 0.0 }   // 0 = remote-camera sentinel; see GL_OBS
    },
    vertexShader: starfieldVertexShader,
    fragmentShader: starfieldFragmentShader,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending
  });
  starfield = new THREE.Points(geo, mat);
  starfield.frustumCulled = false;
  starfield.renderOrder = -1;   // draw as the backdrop
  scene.add(starfield);
}

// Star-count slider: moving DOWN just truncates the draw range (throw out the
// upper end of the existing sky); moving UP past what we've generated regenerates
// a fresh, larger field from scratch.
function setStarCount(newN) {
  nStars = newN;
  if (!starfield) return;
  if (newN > starGeneratedCount) {
    scene.remove(starfield);
    starfield.geometry.dispose();
    starfield.material.dispose();
    buildStarfield(newN);
  } else {
    starfield.geometry.setDrawRange(0, newN);
  }
}

function updateStarfield() {
  if (!starfield) return;
  starfield.visible = starfieldEnabled;
  if (!starfieldEnabled) return;
  const u = starfield.material.uniforms;
  u.uRs.value = RS;         // live horizon scale
  u.uBcrit.value = B_CRIT;
  u.uCamPos.value.copy(camera.position);
  u.uBhSpin.value = bhSpin;
  u.uLensStrength.value = lensStrength;
  u.uHoBright.value = hoBrightness;
  u.uStarBright.value = starBrightness;
  u.uStarPixel.value = starPixel;
  u.uRsOverRcam.value = obsRsOverRcam;   // shared observer gate, computed in animate()
  // share the disk's higher-order-image toggle
  starfield.geometry.instanceCount = ringImagesEnabled ? (MAX_STAR_ORDER + 1) : 1;
}

// =====================================================================
// PER-FRAME: physics step (JS) -> lensing (JS) -> write buffers -> GPU draw
// =====================================================================

//const highlightEl = document.getElementById('highlightLensed');
//const highlightInsideEl = document.getElementById('highlightInside');
//const showHitboxEl = document.getElementById('showHitbox');
//const showForbidEl = document.getElementById('showForbid');

const showHorizonEl = document.getElementById('showHorizon');
const showShapeAxesEl = document.getElementById('showShapeAxes');

const _appPos = new THREE.Vector3();

function updateParticleBuffers() {
  const frame = getCameraFrame(camera, H);
  const camX = frame.camPos.x, camY = frame.camPos.y, camZ = frame.camPos.z;
  const rC = Math.hypot(camX, camY, camZ);
  const showLensHi = false; // highlightEl.checked;
  const showInsideHi = false; // highlightInsideEl.checked;

  // per-frame uniforms
  const u = particleSystem.material.uniforms;
  u.uRs.value = RS;         // live horizon scale
  u.uBcrit.value = B_CRIT;
  u.uRHitbox.value = R_HITBOX;   // grows with the hole (inside-hitbox debug tint)
  u.uCamPos.value.set(camX, camY, camZ);
  u.uHoBright.value = hoBrightness;
  u.uBhSpin.value = bhSpin;
  // rebuild the Kerr critical-curve LUT for the current spin and viewing
  // inclination θo (angle of the camera from the spin axis y). Cheap dirty-check
  // inside skips the work when neither changed.
  {
    const rCcam = Math.hypot(camX, camY, camZ) || 1;
    updateCritLUT(bhSpin, Math.acos(Math.min(1, Math.max(-1, camY / rCcam))));

    // Observer-in-curved-space gate: computed once per frame in animate() from
    // the post-veto camera position, shared with the integrator clock.
    u.uRsOverRcam.value = obsRsOverRcam;
  }
  u.uTemp0K.value = temp0K;
  u.uLensStrength.value = lensStrength;
  u.uDopplerOn.value = dopplerEnabled ? 1 : 0;
  u.uBetaCut.value = betaDopplerCutoff;
  u.uBeamC.value = beamingC;
  u.uShowLensHi.value = showLensHi ? 1 : 0;
  u.uShowInsideHi.value = showInsideHi ? 1 : 0;
  u.uBrightLo.value = brightLo;
  u.uBrightHi.value = brightHi;
  u.uWhiteout.value = whiteoutKnee;
  u.uBrightGamma.value = brightGamma;
  u.uFalseAmt.value = falseAmt;
  u.uFalseDark.value = falseDark;
  u.uFalseColdK.value = falseColdK;
  u.uSizeGain.value = sizeGain;
  particleGeometry.instanceCount = ringImagesEnabled ? (MAX_IMAGE_ORDER + 1) : 1;

  // position (=pos) and aVel (=q) are written by the physics step each frame
  particleGeometry.attributes.position.needsUpdate = true;
  particleGeometry.attributes.aVel.needsUpdate = true;
}

// =====================================================================
// Unit formatting helpers (display only — never fed back into physics)
// =====================================================================

function formatLength(km) {
  const AU_KM = 1.496e8, LS_KM = 299792.458;
  if (km < 1) return (km*1000).toFixed(1) + ' m';
  if (km < 1e6) return km.toFixed(km < 10 ? 2 : 0) + ' km';
  if (km < AU_KM * 0.05) return (km / LS_KM).toFixed(2) + ' light-s';
  if (km < AU_KM * 1e4) return (km / AU_KM).toFixed(3) + ' AU';
  return (km / AU_KM).toExponential(2) + ' AU';
}
function formatTime(sec) {
  if (sec < 1e-6) return (sec*1e9).toFixed(1) + ' ns';
  if (sec < 1e-3) return (sec*1e6).toFixed(1) + ' µs';
  if (sec < 1) return (sec*1e3).toFixed(2) + ' ms';
  if (sec < 60) return sec.toFixed(2) + ' s';
  if (sec < 3600) return (sec/60).toFixed(2) + ' min';
  if (sec < 86400) return (sec/3600).toFixed(2) + ' hr';
  if (sec < 3.156e7) return (sec/86400).toFixed(2) + ' days';
  return (sec/3.156e7).toExponential(2) + ' yr';
}
function formatCompact(x, unit) {
  if (x === 0) return '0' + unit;
  if (Math.abs(x) < 1000 && Math.abs(x) >= 0.01) return x.toPrecision(3) + unit;
  return x.toExponential(2) + unit;
}

// order-of-magnitude reference only: anchored at T_max~1e7 K for a 10 Msun
// BH at Eddington accretion, scaled as T_max ~ M^(-1/4) (standard disk-theory
// scaling). Not used anywhere in the sim, purely a "how much are we cheating"
// comparison against the user-chosen temp0K slider.
function eddingtonPeakTempK(massSolar) {
  return 1e7 * Math.pow(massSolar / 10, -0.25);
}
